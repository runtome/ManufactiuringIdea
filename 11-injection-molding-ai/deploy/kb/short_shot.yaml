defect: short_shot
description_th: "ฉีดไม่เต็ม — โพรงแม่พิมพ์ถูกเติมไม่ครบ"
description_ja: "ショートショット — キャビティの充填不足"
description_en: "Short shot — incomplete filling of the cavity"
causes:
  - cause: insufficient_injection_pressure
    name_ja: 射出圧・速度不足
    prior_weight: 0.30
    typical_params: { injection_pressure: down, injection_speed: down }
    checks: ["Check whether the pressure limit was reached (peak pressure vs setpoint)"]
    actions:
      - { param: injection_speed, direction: up, range: "+5..+10 %", window_ref: setup_sheet, side_effects: "burn marks at the far end, flash" }
    source: "molding troubleshooting guide §4.1"
  - cause: melt_temperature_too_low
    name_ja: 樹脂温度過低
    prior_weight: 0.25
    typical_params: { melt_temperature: down }
    checks: ["Compare zone temperatures with the setup sheet", "Check heater band alarms"]
    actions:
      - { param: melt_temperature, direction: up, range: "+5..+10 C", window_ref: material_datasheet, side_effects: "sink marks, longer cooling" }
    source: "material datasheet PP-H-2000 §3"
  - cause: startup_transient
    name_ja: 立ち上げ過渡
    prior_weight: 0.25
    checks: ["Confirm the shot is within the first 20 after a startup event"]
    note: "Expected in the first shots after a stop; not a process fault"
    source: "internal cases #143, #151"
  - cause: vent_blocked
    name_ja: ガス抜き詰まり
    prior_weight: 0.20
    checks: ["Inspect vents at the far end for deposits"]
    actions:
      - { param: injection_speed, direction: down, range: "-5..-10 %", window_ref: setup_sheet, side_effects: "short shot if too slow" }
    source: "molding troubleshooting guide §4.1"
