openapi: 3.1.0
info:
  title: DocFlow API
  version: 1.0.0
  summary: Business documents in, schema-constrained extraction with provenance, code-side validation, human approval, idempotent ERP posting.
  description: |
    **Scope.** The DocFlow API — standalone, and the `docflow` server module of FactoryBrain in platform mode.
    SRS-08 §4.1's eight paths are kept verbatim under `/api/v1`. The platform's four `/docflow/…` paths and their
    schemas (`DocState`, `DocflowDocument`, `DocflowDocumentDetail`, `ExtractedField`, `Posting`, `Problem`) and the
    parameters `DocumentId`, `Cursor`, `Limit`, `IdempotencyKey` and responses `NotFound`, `ValidationFailed` are copied
    byte-for-byte from API-00 and diffed by TEST-08 TC-008; in platform mode they are served by the platform gateway.

    **Four contracts (API-Specification.md §3–§6):**
    - **Approval** — a document is posted only after an `Approval` by a role sufficient for its amount; above the
      threshold the approver may not be the user who corrected a field (`403 SEGREGATION_OF_DUTIES`). The database
      enforces the same rules; the API only reports them earlier.
    - **Extraction** — every field is `{value, raw, confidence, page, bbox}`; amounts are numbers; a field without
      provenance is low confidence; validation is code, shown per rule with pass/warning/fail.
    - **Posting** — idempotent by `(adapter, idem_key)` with the key derived from the document hash; retries return the
      same `Posting`; failures land in the exception queue, never half-posted.
    - **Injection** — text in a document is data; a flagged phrase forces review and is shown to the reviewer; nothing
      in this API lets a document approve itself.

    Errors are RFC 7807 `application/problem+json` with a stable `code`.
  contact: { name: Suphot N. }
  license: { name: Proprietary }
  x-document-id: API-08-DocFlow

servers:
  - url: https://docflow.plant.local/api/v1
    description: Standalone
  - url: https://factorybrain.plant.local/api/v1
    description: Platform mode (the /docflow/* paths are served by the platform)

security:
  - bearerAuth: []

tags:
  - { name: documents,   description: "Upload, detail, pages, fields, lines, links, audit" }
  - { name: review,      description: "Queues, validation reports, corrections, approve / reject" }
  - { name: posting,     description: "Post to the ERP, retries, exceptions, export files" }
  - { name: master-data, description: "Suppliers, aliases, items, price lists, ERP sync" }
  - { name: config,      description: "Approval policies, gates, STP, tolerances, adapters, intake sources" }
  - { name: governance,  description: "Models (cloud opt-in), prompts, schemas, evaluation runs" }
  - { name: audit,       description: "Audit export" }
  - { name: docflow,     description: "Platform-mode paths (identical to API-00)" }
  - { name: system,      description: "Health and metrics" }

paths:
  # ------------------------------------------------------------------ SRS-08 §4.1 (verbatim paths)
  /documents:
    post:
      tags: [documents]
      summary: Upload a document (SRS §4.1) — deduplicated by sha256; the original is stored immutably; processing is queued
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "PDF, TIFF, PNG/JPEG, XLSX/CSV; ≤ 50 MB" }
                source_hint: { type: string, enum: [upload, scanner] }
                doc_kind_hint: { $ref: '#/components/schemas/DocKind' }
      responses:
        '202': { description: Accepted (state received), content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '200': { description: "Same content hash already exists — the existing document is returned and a link is recorded (FR-03)", content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: File too large, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: Type not allowed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      tags: [documents]
      summary: List documents
      operationId: listDocuments
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/DocState' } }
        - { name: doc_kind, in: query, schema: { $ref: '#/components/schemas/DocKind' } }
        - { name: supplier, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Documents, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Document' } }, next_cursor: { type: string } } } } } }

  /documents/{id}:
    get:
      tags: [documents]
      summary: Document + extraction + provenance (SRS §4.1) — fields with page/bbox, lines, validation report, gate, flags, links, required role
      operationId: getDocument
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Detail, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/fields:
    patch:
      tags: [review]
      summary: Reviewer corrections (SRS §4.1) — append-only; validation re-runs; the corrector becomes an editor for segregation of duties
      operationId: correctFields
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [corrections], properties: { corrections: { type: array, minItems: 1, items: { $ref: '#/components/schemas/FieldCorrection' } } } }
      responses:
        '200': { description: Corrections stored; new validation report, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "Document not editable in its state (posted/posting)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /documents/{id}/approve:
    post:
      tags: [review]
      summary: Approve (SRS §4.1) — role checked against the amount; segregation of duties above the threshold; audited
      operationId: approveDocument
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '403': { description: "ROLE_INSUFFICIENT or SEGREGATION_OF_DUTIES — refused and audited (AC-07)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: "APPROVAL_STATE (not validated/review_required) or DUPLICATE_INVOICE", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /documents/{id}/reject:
    post:
      tags: [review]
      summary: Reject with a reason (SRS §4.1, FR-27) — optionally replies to the sender
      operationId: rejectDocument
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '422': { description: REASON_REQUIRED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /documents/{id}/post:
    post:
      tags: [posting]
      summary: Post to the ERP (SRS §4.1) — queued; idempotent by the derived key; returns the Posting row
      operationId: postDocument
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostingRequest' }
      responses:
        '202': { description: Posting queued (or already exists — same row returned), content: { application/json: { schema: { $ref: '#/components/schemas/Posting' } } } }
        '409': { description: "NOT_APPROVED, ROLE_INSUFFICIENT, SEGREGATION_OF_DUTIES, ADAPTER_UNKNOWN", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /queue:
    get:
      tags: [review]
      summary: Review / exception queues (SRS §4.1)
      operationId: getQueue
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, enum: [review, approval, exception, posting] } }
        - { name: doc_kind, in: query, schema: { $ref: '#/components/schemas/DocKind' } }
        - { name: mine, in: query, description: "only documents the caller may approve", schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Queue, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/QueueItem' } }, next_cursor: { type: string } } } } } }

  /validation/{id}:
    get:
      tags: [review]
      summary: Validation report (SRS §4.1, FR-22) — every rule with pass/warning/fail, detail and the gate
      operationId: getValidation
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationReport' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ documents (more)
  /documents/{id}/pages/{pageNo}:
    get:
      tags: [documents]
      summary: Page image (signed URL, 15 min) — the view is written to the access log (SEC-116)
      operationId: getPage
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: pageNo, in: path, required: true, schema: { type: integer, minimum: 1 } } ]
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/PageImage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{id}/original:
    get:
      tags: [documents]
      summary: Signed URL to the immutable original (5 min) — access-logged; auditors and admins only by default
      operationId: getOriginal
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Signed URL, content: { application/json: { schema: { type: object, properties: { url: { type: string, format: uri }, sha256: { type: string }, expires_at: { type: string, format: date-time } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /documents/{id}/lines:
    get:
      tags: [documents]
      summary: Line items with item-master matches and provenance (FR-11, FR-17)
      operationId: getLines
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Lines, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LineItem' } } } } }
  /documents/{id}/links:
    get:
      tags: [documents]
      summary: Duplicate / split / related links (FR-03, FR-04, FR-20)
      operationId: getLinks
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Links, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DocumentLink' } } } } }
  /documents/{id}/audit:
    get:
      tags: [audit]
      summary: Who saw, edited, approved and posted this document (FR-28, AC-09)
      operationId: getDocumentAudit
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } } } } }
  /documents/{id}/reprocess:
    post:
      tags: [documents]
      summary: Re-run OCR/extraction/validation with the active model, prompt and schema (FR-13 idempotent re-run; e.g. after a template change)
      operationId: reprocessDocument
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '202': { description: Queued }
        '409': { description: Not allowed for posted documents, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /documents/{id}/retry:
    post:
      tags: [posting]
      summary: Retry a failed posting now (FR-32) — same idem_key; attempts increment
      operationId: retryPosting
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '202': { description: Retry queued, content: { application/json: { schema: { $ref: '#/components/schemas/Posting' } } } }
        '409': { description: Not in posting_failed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /documents/{id}/export-file:
    get:
      tags: [posting]
      summary: The CSV/XML file produced by the file-export adapter (FR-33, ICD-08 IF-48)
      operationId: getExportFile
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Signed URL, content: { application/json: { schema: { $ref: '#/components/schemas/ExportFile' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /exceptions:
    get:
      tags: [posting]
      summary: Exception queue — failed postings and extraction failures (FR-32)
      operationId: listExceptions
      responses:
        '200': { description: Items, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExceptionItem' } } } } }
  /status:
    get:
      tags: [documents]
      summary: Case status by document number (FR-35) — also exposed as the tool get_document_status
      operationId: getStatusByNumber
      parameters:
        - { name: doc_number, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: supplier, in: query, schema: { type: string } }
      responses:
        '200': { description: Matches, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StatusResult' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------------ master data
  /suppliers:
    get:
      tags: [master-data]
      summary: Suppliers (synced from the ERP) with aliases and templates
      operationId: listSuppliers
      parameters: [ { name: q, in: query, schema: { type: string } } ]
      responses:
        '200': { description: Suppliers, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Supplier' } } } } }
  /suppliers/{supplierId}/aliases:
    post:
      tags: [master-data]
      summary: Add a name / tax id / mail-domain / layout alias (FR-07)
      operationId: addSupplierAlias
      parameters: [ { $ref: '#/components/parameters/SupplierId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierAlias' }
      responses:
        '201': { description: Added }
        '409': { description: Alias already mapped, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /suppliers/{supplierId}/templates:
    get:
      tags: [master-data]
      summary: Template versions with measured accuracy (FR-14, ADR-D08)
      operationId: listTemplates
      parameters: [ { $ref: '#/components/parameters/SupplierId' } ]
      responses:
        '200': { description: Templates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Template' } } } } }
    post:
      tags: [master-data]
      summary: Create a new template version (inactive until activated)
      operationId: createTemplate
      parameters: [ { $ref: '#/components/parameters/SupplierId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Template' } } } }
  /suppliers/{supplierId}/templates/{version}/activate:
    post:
      tags: [master-data]
      summary: Activate a template version (one active per supplier and kind)
      operationId: activateTemplate
      parameters: [ { $ref: '#/components/parameters/SupplierId' }, { name: version, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: Activated, content: { application/json: { schema: { $ref: '#/components/schemas/Template' } } } }
  /items/aliases:
    post:
      tags: [master-data]
      summary: Map a supplier part number to an item (FR-17)
      operationId: addItemAlias
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemAlias' }
      responses:
        '201': { description: Mapped }
  /price-lists:
    get:
      tags: [master-data]
      summary: Contract / quotation prices by supplier and item (FR-18)
      operationId: listPrices
      parameters: [ { name: supplier, in: query, schema: { type: string } }, { name: item, in: query, schema: { type: string } } ]
      responses:
        '200': { description: Prices, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PriceListEntry' } } } } }
  /master-data/sync:
    post:
      tags: [master-data]
      summary: Pull suppliers, items, price lists, open POs and goods receipts from the ERP now (read-only adapter calls, IF-07)
      operationId: syncMasterData
      responses:
        '202': { description: Sync started, content: { application/json: { schema: { type: object, properties: { job_id: { type: string } } } } } }

  # ------------------------------------------------------------------ configuration
  /policies:
    get:
      tags: [config]
      summary: Approval policies (FR-26) and the segregation-of-duties threshold (NFR-05)
      operationId: listPolicies
      responses:
        '200': { description: Policies, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApprovalPolicy' } } } } }
  /config:
    get:
      tags: [config]
      summary: Current configuration document with its version (policies, gates, STP, tolerances, adapters, intake sources, retention, model flags)
      operationId: getConfig
      responses:
        '200': { description: Config, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigVersion' } } } }
    put:
      tags: [config]
      summary: Load a configuration document (validated against deploy/schemas/docflow-config.schema.json); versioned and audited
      operationId: putConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Loaded, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigVersion' } } } }
        '422': { description: "CONFIG_INVALID — e.g. STP enabled without evidence, tolerance above 20 %, cloud model without acknowledgement, retention below 7 years", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /stp:
    get:
      tags: [config]
      summary: Straight-through-processing eligibility per supplier and kind (FR-29) — posted documents, accuracy without corrections, current flag
      operationId: stpEligibility
      responses:
        '200': { description: Rows, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StpRow' } } } } }
  /stp/{docKind}/{supplierId}:
    put:
      tags: [config]
      summary: Enable or disable STP for a pair — enabling requires measured accuracy ≥ 98 % on ≥ 50 documents (stp_needs_evidence); audited
      operationId: setStp
      parameters: [ { name: docKind, in: path, required: true, schema: { $ref: '#/components/schemas/DocKind' } }, { $ref: '#/components/parameters/SupplierId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/StpRow' } } } }
        '409': { description: STP_NEEDS_EVIDENCE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /adapters:
    get:
      tags: [config]
      summary: Registered ERP adapters (IF-07) — every one declares idem_key support
      operationId: listAdapters
      responses:
        '200': { description: Adapters, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Adapter' } } } } }
  /adapters/{name}/test:
    post:
      tags: [config]
      summary: Read-only connectivity test (lookup_supplier / find_open_po) — never a create call
      operationId: testAdapter
      parameters: [ { name: name, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, latency_ms: { type: integer }, detail: { type: string } } } } } }
  /intake/sources:
    get:
      tags: [config]
      summary: Intake sources (IMAP, folder, SFTP, scanner) with last poll and error — no credentials
      operationId: listIntakeSources
      responses:
        '200': { description: Sources, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IntakeSource' } } } } }
  /intake/sources/{sourceId}/poll:
    post:
      tags: [config]
      summary: Poll a source now
      operationId: pollIntakeSource
      parameters: [ { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '202': { description: Poll started }

  # ------------------------------------------------------------------ governance
  /models:
    get:
      tags: [governance]
      summary: Registered models by kind — the active extraction model, and whether any cloud model is enabled (NFR-07)
      operationId: listModels
      responses:
        '200': { description: Models, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ModelVersion' } } } } }
  /models/{modelId}/cloud:
    post:
      tags: [governance]
      summary: Enable a cloud model — admin only; requires an explicit acknowledgement; audited; every extraction made with it is marked (C-05, NFR-07)
      operationId: enableCloudModel
      parameters: [ { name: modelId, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloudEnableRequest' }
      responses:
        '200': { description: Enabled and audited, content: { application/json: { schema: { $ref: '#/components/schemas/ModelVersion' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: CLOUD_NOT_ACKNOWLEDGED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /eval/runs:
    get:
      tags: [governance]
      summary: Evaluation runs on the 200-document set with the release gate (AI-03, AI-09)
      operationId: listEvalRuns
      responses:
        '200': { description: Runs, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EvalRun' } } } } }
    post:
      tags: [governance]
      summary: Record an evaluation run; release_blocked is computed (below target or −2 points vs the baseline)
      operationId: recordEvalRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvalRunCreate' }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/EvalRun' } } } }

  # ------------------------------------------------------------------ audit
  /audit/export:
    get:
      tags: [audit]
      summary: Full audit export for a period (AC-09) — CSV or JSON; auditor role
      operationId: auditExport
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200': { description: Export, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } } }, text/csv: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ platform mode — identical to API-00 (TC-008)
  /docflow/documents:
    get:
      tags: [docflow]
      summary: Document queue
      operationId: listDocflowDocuments
      parameters:
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/DocState'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocflowDocument'
    post:
      tags: [docflow]
      summary: Upload a business document
      operationId: uploadDocflowDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocflowDocument'
        '409':
          description: Duplicate document (same content hash)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocflowDocument'

  /docflow/documents/{documentId}:
    get:
      tags: [docflow]
      summary: Document with extraction, provenance and validation results
      operationId: getDocflowDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocflowDocumentDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /docflow/documents/{documentId}/approve:
    post:
      tags: [docflow]
      summary: Approve a document for posting
      description: |
        Role required depends on the document amount (configurable thresholds).
        Segregation of duties applies: above the configured amount the approver
        may not be the user who edited the extracted fields.
      operationId: approveDocflowDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocflowDocument'
        '403':
          description: Insufficient role, or segregation-of-duties violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /docflow/documents/{documentId}/post:
    post:
      tags: [docflow]
      summary: Post an approved document to the ERP
      description: |
        Idempotent by `(adapter, idem_key)`. Retrying a failed posting can
        never create a second ERP transaction — this is enforced by a unique
        constraint in the database, not only by application logic.
      operationId: postDocflowDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Posted (or already posted — same ERP reference returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posting'
        '409':
          description: Not approved, or approval expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: ERP rejected or was unreachable; safe to retry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ------------------------------------------------------------------ system
  /healthz:
    get:
      tags: [system]
      summary: Liveness
      operationId: healthz
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
  /readyz:
    get:
      tags: [system]
      summary: Readiness — DB, Redis, object store, OCR, model, backlog per stage (a stopped model does not fail readiness, NFR-08)
      operationId: readyz
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { type: object, properties: { db: { type: boolean }, redis: { type: boolean }, object_store: { type: boolean }, ocr: { type: boolean }, model: { type: boolean }, erp: { type: boolean }, backlog: { type: object, additionalProperties: { type: integer } }, oldest_age_s: { type: integer }, cloud_model_enabled: { type: boolean } } } } } }
        '503': { description: "DB, Redis or object store unavailable", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics (ICD-08 IF-14) — internal network only
      operationId: metrics
      security: []
      responses:
        '200': { description: Metrics, content: { text/plain: { schema: { type: string } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform-shape roles viewer < inspector (clerk) < engineer (AP, warehouse) < manager < admin; auditor = viewer with the audit scope

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    SupplierId: { name: supplierId, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from the previous page's `next_cursor`
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
      description: |
        Client-generated key. Replaying a request with the same key returns the
        original result instead of performing the operation twice.
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest: { description: Malformed request, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Missing or invalid token, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Role insufficient / segregation of duties / access not permitted, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Request was well-formed but semantically invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ------------------------------------------------ identical to API-00 (TC-008)
    Problem:
      type: object
      description: RFC 7807 problem details with a stable machine-readable `code`.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable error code — see API-Specification.md §7
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    DocState:
      type: string
      enum: [received, classified, extracted, validated, review_required,
             approved, rejected, posting, posted, posting_failed]

    DocflowDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: [string, 'null'] }
        lang: { type: [string, 'null'] }
        source: { type: string }
        state:
          $ref: '#/components/schemas/DocState'
        page_count: { type: [integer, 'null'] }
        received_at: { type: string, format: date-time }

    DocflowDocumentDetail:
      allOf:
        - $ref: '#/components/schemas/DocflowDocument'
        - type: object
          properties:
            header:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ExtractedField'
            lines:
              type: array
              items: { type: object, additionalProperties: true }
            validation:
              type: array
              items:
                type: object
                properties:
                  rule: { type: string }
                  status: { type: string, enum: [pass, warning, fail] }
                  detail: { type: object, additionalProperties: true }
            gate:
              type: string
              enum: [auto_clear, review_required, blocked]
            page_images:
              type: array
              items: { type: string }

    ExtractedField:
      type: object
      properties:
        value: {}
        raw: { type: [string, 'null'] }
        confidence: { type: [number, 'null'] }
        page: { type: [integer, 'null'] }
        bbox:
          type: [object, 'null']
          additionalProperties: true
          description: |
            Provenance. A field without page and bbox is treated as low
            confidence regardless of the model's score.
        corrected: { type: boolean }
        corrected_by: { type: [string, 'null'] }

    Posting:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        adapter: { type: string }
        idem_key: { type: string }
        erp_ref: { type: [string, 'null'] }
        status: { type: string, enum: [pending, succeeded, failed] }
        attempts: { type: integer }
        last_error: { type: [string, 'null'] }

    # ------------------------------------------------ DocFlow
    DocKind: { type: string, enum: [purchase_order, invoice, delivery_note, quotation, certificate, other] }
    GateResult: { type: string, enum: [auto_clear, review_required, blocked] }
    RuleStatus: { type: string, enum: [pass, warning, fail] }
    Role: { type: string, enum: [viewer, inspector, engineer, manager, admin] }

    Document:
      allOf:
        - $ref: '#/components/schemas/DocflowDocument'
        - type: object
          properties:
            sha256: { type: string }
            doc_kind: { $ref: '#/components/schemas/DocKind' }
            kind_confidence: { type: number }
            supplier: { type: object, properties: { id: { type: string, format: uuid }, code: { type: string }, name: { type: string } } }
            doc_number: { type: string }
            doc_date: { type: string, format: date }
            currency: { type: string }
            subtotal: { type: number }
            tax: { type: number }
            total: { type: number }
            amount_thb: { type: number, description: "for the approval policy only (FR-26); the ERP receives the document currency" }
            gate: { $ref: '#/components/schemas/GateResult' }
            injection_flagged: { type: boolean }
            text_source: { type: string, enum: [text_layer, ocr, mixed] }
            required_role: { $ref: '#/components/schemas/Role' }
            sod_required: { type: boolean }
            rules_failed: { type: integer }
            rules_warning: { type: integer }
            erp_ref: { type: string }
            intake: { type: object, description: "from / subject / file name — never bodies", additionalProperties: true }
    DocumentDetail:
      allOf:
        - $ref: '#/components/schemas/Document'
        - type: object
          properties:
            extraction: { type: object, properties: { id: { type: string, format: uuid }, model_version: { type: string }, prompt_version: { type: string }, schema_version: { type: string }, cloud: { type: boolean, description: "true when a cloud model produced this extraction (NFR-07)" }, schema_valid: { type: boolean }, repair_rounds: { type: integer, maximum: 2 }, created_at: { type: string, format: date-time } } }
            header: { type: object, additionalProperties: { $ref: '#/components/schemas/Field' } }
            lines: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
            validation: { $ref: '#/components/schemas/ValidationReport' }
            injection_flags: { type: array, items: { $ref: '#/components/schemas/InjectionFlag' } }
            links: { type: array, items: { $ref: '#/components/schemas/DocumentLink' } }
            approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
            posting: { $ref: '#/components/schemas/Posting' }
            editors: { type: array, items: { type: string, format: uuid }, description: "users who corrected a field — they may not approve above the SoD threshold" }
            page_images: { type: array, items: { $ref: '#/components/schemas/PageImage' } }
    Field:
      allOf:
        - $ref: '#/components/schemas/ExtractedField'
        - type: object
          properties:
            id: { type: string, format: uuid }
            path: { type: string }
            below_gate: { type: boolean, description: "confidence below the field's gate, or a critical field without provenance (AI-04, AI-05)" }
            corrected_value: { type: string }
            corrected_at: { type: string, format: date-time }
    FieldCorrection:
      type: object
      required: [field_id, new_value]
      properties:
        field_id: { type: string, format: uuid }
        new_value: { type: string }
        reason: { type: string, maxLength: 300 }
    LineItem:
      type: object
      required: [line_no, confidence]
      properties:
        line_no: { type: integer }
        part_no: { type: string }
        matched_item: { type: string, description: "core.sku code via item alias (FR-17)" }
        description: { type: string }
        qty: { type: number }
        unit: { type: string }
        unit_price: { type: number }
        amount: { type: number }
        tax_code: { type: string }
        delivery_date: { type: string, format: date }
        confidence: { type: number }
        page: { type: integer }
        bbox: { type: array, items: { type: number } }
    ValidationRule:
      type: object
      required: [rule, status, ran_at]
      properties:
        rule: { type: string, description: "arithmetic.line · arithmetic.total · supplier.master · item.master · price.contract · match.2way.qty · match.2way.price · match.3way.qty · duplicate.invoice · tax.consistency · injection.flag · confidence.gate" }
        status: { $ref: '#/components/schemas/RuleStatus' }
        detail: { type: object, additionalProperties: true }
        ran_at: { type: string, format: date-time }
    ValidationReport:
      type: object
      required: [document_id, gate, rules]
      properties:
        document_id: { type: string, format: uuid }
        gate: { $ref: '#/components/schemas/GateResult' }
        stp_enabled: { type: boolean }
        template_matched: { type: boolean }
        rules: { type: array, items: { $ref: '#/components/schemas/ValidationRule' } }
    ApprovalRequest:
      type: object
      properties:
        comment: { type: string, maxLength: 500 }
        acknowledge_warnings: { type: boolean, description: "must be true when the report has warnings" }
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        reply_to_sender: { type: boolean, default: false }
    Approval:
      type: object
      required: [id, document_id, user_id, role, decision, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    PostingRequest:
      type: object
      properties:
        adapter: { type: string, description: "defaults to the configured adapter for the document kind" }
    QueueItem:
      type: object
      required: [id, doc_kind, state, received_at]
      properties:
        id: { type: string, format: uuid }
        doc_kind: { $ref: '#/components/schemas/DocKind' }
        state: { $ref: '#/components/schemas/DocState' }
        doc_number: { type: string }
        supplier_name: { type: string }
        total: { type: number }
        currency: { type: string }
        amount_thb: { type: number }
        required_role: { $ref: '#/components/schemas/Role' }
        gate: { $ref: '#/components/schemas/GateResult' }
        rules_failed: { type: integer }
        rules_warning: { type: integer }
        injection_flagged: { type: boolean }
        received_at: { type: string, format: date-time }
    ExceptionItem:
      type: object
      required: [id, exception_kind]
      properties:
        id: { type: string, format: uuid }
        doc_kind: { $ref: '#/components/schemas/DocKind' }
        doc_number: { type: string }
        state: { $ref: '#/components/schemas/DocState' }
        exception_kind: { type: string, enum: [posting, extraction_failed, quality_too_low, validation] }
        adapter: { type: string }
        attempts: { type: integer }
        last_error: { type: string }
        last_attempt_at: { type: string, format: date-time }
    ExportFile:
      type: object
      required: [format, sha256, url]
      properties:
        format: { type: string, enum: [csv, xml] }
        sha256: { type: string }
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    StatusResult:
      type: object
      required: [id, doc_kind, doc_number, state]
      properties:
        id: { type: string, format: uuid }
        doc_kind: { $ref: '#/components/schemas/DocKind' }
        doc_number: { type: string }
        supplier_name: { type: string }
        state: { $ref: '#/components/schemas/DocState' }
        gate: { $ref: '#/components/schemas/GateResult' }
        approved_at: { type: string, format: date-time }
        erp_ref: { type: string }
        received_at: { type: string, format: date-time }
    PageImage:
      type: object
      required: [page_no, url, width, height]
      properties:
        page_no: { type: integer }
        url: { type: string, format: uri, description: "signed, 15 min" }
        width: { type: integer }
        height: { type: integer }
        text_source: { type: string, enum: [text_layer, ocr] }
        ocr_conf: { type: number }
    DocumentLink:
      type: object
      required: [related_id, kind]
      properties:
        related_id: { type: string, format: uuid }
        kind: { type: string, enum: [duplicate, split_child, supersedes, related] }
        detail: { type: string }
        created_at: { type: string, format: date-time }
    InjectionFlag:
      type: object
      required: [phrase, classifier, score]
      properties:
        page: { type: integer }
        bbox: { type: array, items: { type: number } }
        phrase: { type: string }
        classifier: { type: string }
        score: { type: number }
    AuditEntry:
      type: object
      required: [document_id, ts, action]
      properties:
        document_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        user_id: { type: string, format: uuid }
        username: { type: string }
        actor: { type: string }
        action: { type: string, description: "docflow.approved · docflow.rejected · docflow.correct_field · docflow.posted · docflow.view_original · docflow.view_page · docflow.injection_flagged · docflow.cloud_model_enabled · …" }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        ip: { type: string }
    Supplier:
      type: object
      required: [id, code, name, country, currency]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        tax_id: { type: string }
        country: { type: string }
        currency: { type: string }
        erp_ref: { type: string }
        aliases: { type: array, items: { $ref: '#/components/schemas/SupplierAlias' } }
        active_templates: { type: array, items: { $ref: '#/components/schemas/Template' } }
        stp: { type: array, items: { $ref: '#/components/schemas/StpRow' } }
        synced_at: { type: string, format: date-time }
    SupplierAlias:
      type: object
      required: [kind, alias]
      properties:
        kind: { type: string, enum: [name, tax_id, email_domain, layout_key] }
        alias: { type: string }
    ItemAlias:
      type: object
      required: [supplier_id, supplier_part_no, item_code]
      properties:
        supplier_id: { type: string, format: uuid }
        supplier_part_no: { type: string }
        item_code: { type: string, description: "core.sku code, e.g. ITM-8891" }
    PriceListEntry:
      type: object
      required: [supplier_code, item_code, currency, unit_price, source, valid_from]
      properties:
        supplier_code: { type: string }
        item_code: { type: string }
        currency: { type: string }
        unit_price: { type: number }
        source: { type: string, enum: [contract, quotation, last_invoice] }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
    TemplateCreate:
      type: object
      required: [doc_kind, layout_hints]
      properties:
        doc_kind: { $ref: '#/components/schemas/DocKind' }
        layout_hints: { type: object, additionalProperties: true, description: "anchors, table columns, date formats, language (ICD-08 IF-46/IF-47)" }
    Template:
      type: object
      required: [id, supplier_id, doc_kind, version, active]
      properties:
        id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        doc_kind: { $ref: '#/components/schemas/DocKind' }
        version: { type: integer }
        layout_hints: { type: object, additionalProperties: true }
        accuracy_measured: { type: number }
        n_measured: { type: integer }
        active: { type: boolean }
        drift_alert: { type: boolean }
        created_at: { type: string, format: date-time }
    ApprovalPolicy:
      type: object
      required: [min_role, sod_required, priority]
      properties:
        doc_kind: { $ref: '#/components/schemas/DocKind' }
        max_amount_thb: { type: number, description: "null = no upper bound" }
        min_role: { $ref: '#/components/schemas/Role' }
        sod_required: { type: boolean }
        priority: { type: integer }
    StpRow:
      type: object
      required: [supplier_id, doc_kind, stp_enabled]
      properties:
        supplier_id: { type: string, format: uuid }
        supplier_code: { type: string }
        doc_kind: { $ref: '#/components/schemas/DocKind' }
        posted: { type: integer }
        posted_without_correction: { type: integer }
        accuracy: { type: number }
        stp_enabled: { type: boolean }
        enabled_by: { type: string }
        enabled_at: { type: string, format: date-time }
    Adapter:
      type: object
      required: [name, kind, supports_idem, active]
      properties:
        name: { type: string }
        kind: { type: string, enum: [rest, soap, staging_table, file_export] }
        supports_idem: { type: boolean, const: true }
        config: { type: object, additionalProperties: true, description: "no credentials" }
        active: { type: boolean }
    IntakeSource:
      type: object
      required: [id, kind, name, active]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [imap, folder, sftp, scanner, upload] }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        active: { type: boolean }
        last_poll_at: { type: string, format: date-time }
        last_error: { type: string }
    ConfigVersion:
      type: object
      required: [version, loaded_at, doc]
      properties:
        version: { type: string }
        loaded_at: { type: string, format: date-time }
        loaded_by: { type: string, format: uuid }
        doc: { type: object, additionalProperties: true }
    ModelVersion:
      type: object
      required: [id, kind, name, version, cloud, active]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [extraction, classifier, ocr, injection, embedding] }
        name: { type: string }
        version: { type: string }
        cloud: { type: boolean }
        cloud_acknowledged_by: { type: string }
        cloud_acknowledged_at: { type: string, format: date-time }
        active: { type: boolean }
        checksum: { type: string }
    CloudEnableRequest:
      type: object
      required: [acknowledged, statement]
      properties:
        acknowledged: { type: boolean, const: true }
        statement: { type: string, const: "I understand that document content including pricing will leave the premises." }
    EvalRunCreate:
      type: object
      required: [model_version, prompt_version, schema_version, dataset, n_docs, header_acc, line_acc, class_acc]
      properties:
        model_version: { type: string }
        prompt_version: { type: string }
        schema_version: { type: string }
        dataset: { type: string }
        n_docs: { type: integer, minimum: 1 }
        header_acc: { type: number, minimum: 0, maximum: 1 }
        line_acc: { type: number, minimum: 0, maximum: 1 }
        class_acc: { type: number, minimum: 0, maximum: 1 }
        baseline_run_id: { type: integer }
    EvalRun:
      allOf:
        - $ref: '#/components/schemas/EvalRunCreate'
        - type: object
          properties:
            id: { type: integer }
            release_blocked: { type: boolean }
            block_reason: { type: string }
            ran_at: { type: string, format: date-time }
