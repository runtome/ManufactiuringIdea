# =====================================================================
# ShiftBrief (Production AI Analyst) — standalone reference stack
# Document : OPS-02-ShiftBrief (see ../docs/OPS-ShiftBrief-Deployment-Operations.md)
# Version  : 1.0
# Date     : 2026-09-12
#
# Usage:
#   cp .env.example .env            # edit; never commit
#   docker compose up -d            # CPU-only reference profile (no GPU needed)
#   docker compose --profile gpu up -d      # GPU profile (larger model, faster brief)
#   docker compose --profile sftp up -d     # + built-in SFTP intake
#
# The REFERENCE deployment is CPU-only on a small server / VPS (ADR-S06).
# The GPU profile is optional. Nothing here requires a GPU to be useful.
#
# PLATFORM MODE: do NOT use this file. Apply migration shiftbrief_0001 to
# the FactoryBrain database and register the ShiftBrief modules; the API,
# DB, object store, LLM and web are the platform's (SAD-02 section 9).
#
# IMAGE PINNING: production deployments MUST pin by digest (SEC-192).
# =====================================================================

name: shiftbrief

x-logging: &default-logging
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

x-app-common: &app-common
  image: ${SB_IMAGE_APP:-shiftbrief/app:1.0.0}
  restart: unless-stopped
  logging: *default-logging
  env_file: [.env]
  depends_on:
    postgres: { condition: service_healthy }
    redis:    { condition: service_healthy }
    minio:    { condition: service_healthy }
  networks: [backend]

services:

  # ------------------------------------------------------------ data
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiftbrief}
      POSTGRES_USER: ${POSTGRES_USER:-shiftbrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=80
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ../db:/docker-entrypoint-initdb.d:ro     # schema.sql (+ seed) on FIRST start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiftbrief} -d ${POSTGRES_DB:-shiftbrief}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set sb http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      for b in archives exports backups; do
        mc mb --ignore-existing sb/$$b; mc anonymous set none sb/$$b;
      done &&
      mc version enable sb/archives &&
      mc ilm rule add --expire-days 730 sb/archives || true;
      mc ilm rule add --expire-days 365 sb/exports  || true;
      mc ilm rule add --expire-days 90  sb/backups  || true;
      echo 'bucket init complete'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [backend]
    restart: "no"

  # ------------------------------------------------------- inference
  # CPU-only by default (ADR-S06). The `gpu` profile adds a reservation and
  # expects a larger LLM_MODEL in .env; the image is the same.
  ollama:
    image: ollama/ollama:0.5.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-4}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-6g}
    networks: [backend]

  ollama-gpu:
    image: ollama/ollama:0.5.4
    restart: unless-stopped
    logging: *default-logging
    profiles: ["gpu"]
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      backend:
        aliases: [ollama]     # brief/ask reach "ollama" either way
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------ application
  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app-common
    command: ["uvicorn", "shiftbrief.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [backend, frontend]

  intake:
    <<: *app-common
    command: ["python", "-m", "shiftbrief.intake.worker"]
    volumes:
      - ${SB_INCOMING_DIR:-./incoming}:/data/incoming
    deploy:
      resources:
        limits:
          memory: 2g           # file parsing is sandboxed here, never in the API (SEC-S10)
          cpus: "2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [backend, intake]   # intake network: IMAP/SFTP reach only

  worker:
    <<: *app-common
    command: ["rq", "worker", "--with-scheduler", "facts", "exports", "retention", "alerts"]
    healthcheck:
      test: ["CMD-SHELL", "rq info --url redis://redis:6379 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  brief:
    <<: *app-common
    command: ["python", "-m", "shiftbrief.brief.runner"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      ollama:   { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notifier:
    <<: *app-common
    command: ["python", "-m", "shiftbrief.notifier.bot"]
    deploy:
      replicas: 1              # single Discord gateway session
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8300/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [backend, frontend]   # frontend for Discord/SMTP egress (allow-listed)

  web:
    image: ${SB_IMAGE_WEB:-shiftbrief/web:1.0.0}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: ${SB_PUBLIC_URL:-https://shiftbrief.local}/api/v1
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [frontend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [frontend]

  # ------------------------------------------------- optional intake
  sftp:
    image: atmoz/sftp:alpine
    restart: unless-stopped
    logging: *default-logging
    profiles: ["sftp"]
    ports:
      - "2222:22"
    command: ["${SFTP_USER:-mes}:${SFTP_PASSWORD:-}:1001:1001:incoming"]
    volumes:
      - ${SB_INCOMING_DIR:-./incoming}/mes:/home/${SFTP_USER:-mes}/incoming
      - ./sftp/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./sftp/authorized_keys:/home/${SFTP_USER:-mes}/.ssh/keys/authorized_keys:ro
    networks: [intake]

  # ----------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    networks: [backend]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus: { condition: service_started }
    networks: [backend, frontend]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env]
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 86400; /backup.sh; done"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true       # egress default-deny for data-plane services (SEC-240)
  intake:
    driver: bridge       # intake worker + sftp only; IMAP egress allow-listed at the firewall

volumes:
  pgdata:
  wal_archive:
  redisdata:
  miniodata:
  ollama_models:
  promdata:
  grafanadata:
  caddy_data:
  caddy_config:
  backups:

# =====================================================================
# NOTES
# 1. `backend` is internal: postgres, redis, minio, ollama, worker, brief
#    have no internet route. Pre-pull the model into `ollama_models`
#    (OPS section 5). Air-gapped deployments behave identically.
# 2. `../db` mounts schema.sql and seed_demo.sql into the Postgres init
#    directory: applied on FIRST start only. Remove seed_demo.sql from the
#    mount for a production database.
# 3. CPU profile: the default `ollama` service has no GPU reservation and a
#    memory limit sized for a <= 4B Q4 model. `--profile gpu` starts
#    `ollama-gpu` with the network alias "ollama"; stop the CPU service
#    first (`docker compose stop ollama`) so the alias is unambiguous.
# 4. `intake` is the only service that parses files, with its own CPU and
#    memory limits (SEC-S10). It is also the only service on the `intake`
#    network, which is where IMAP/SFTP reach.
# 5. Only caddy (443/80) and sftp (2222, profile) publish host ports.
# =====================================================================
