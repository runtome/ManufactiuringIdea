# KaizenSwarm scenario suite (IF-71) — generated from one source together with the seed; SC-15 is a deliberate engineer/table disagreement.
suite: kaizenswarm-scenarios
version: 1
weights_version: v1
gate:
  top3_match_min: 0.8
  fabricated_max: 0
note: 'AI-06 / AC-01. Deterministic half (dedupe, compounds, scoring, ranking) runs in SQL via swarm.run_suite(); the LLM half (phrasing, claim check, zero fabricated) runs in CI (TEST-13 TC-070). Expected
  top risks are identifiers: F<n> for a finding (the first id of a merged group), C:<ids joined by +> for a compound. Equal to db/seed_demo.sql (TEST-13 TC-006).'
scenarios:
- code: SC-01
  title: Appendix A — quality + maintenance on line 3, material coverage, line 1 OEE
  plant_state: Defect rate 5.82 % on line 3 with an open M-07 bearing alert; RAD-500-A coverage 1.4 d; line 1 performance loss
  findings:
  - id: F1
    agent: quality
    domain: quality
    scope:
      plant: 1
      line: 3
      sku: RAD-500-A
    title: Defect rate 5.82 % on line 3 (+141 % vs 7-day)
    severity: HIGH
    likelihood_class: observed
    horizon: this_shift
    confidence: 0.85
    issue_code: quality.defect_rate
  - id: F2
    agent: maintenance
    domain: machine_health
    scope:
      plant: 1
      line: 3
      machine: M-07
    title: Bearing temperature trending up on M-07
    severity: HIGH
    likelihood_class: observed
    horizon: within_3_days
    confidence: 0.78
    issue_code: machine.degradation
  - id: F3
    agent: material
    domain: material
    scope:
      plant: 1
      sku: RAD-500-A
    title: Coverage risk for SKU RAD-500-A
    severity: HIGH
    likelihood_class: observed
    horizon: this_shift
    confidence: 0.89
    issue_code: material.shortage
  - id: F4
    agent: production
    domain: production
    scope:
      plant: 1
      line: 1
    title: OEE performance loss on Line 1
    severity: MEDIUM
    likelihood_class: observed
    horizon: today
    confidence: 0.96
    issue_code: production.performance_loss
  expected_top:
  - C:F1+F2
  - F3
  - F4
