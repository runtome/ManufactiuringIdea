# KaizenSwarm — NATS JetStream configuration (IF-17; SEC-K12). Mounted read-only into the nats container.
# One account per party. An agent can publish only its own finding/status subjects and subscribe only to its own requests;
# the orchestrator publishes requests and run lifecycle and subscribes to every agent's finding/status subjects.
# Credentials (user/password or NKey seeds) are FILES under ${SECRETS_DIR}: nats_api_creds, nats_orchestrator_creds, nats_agent_<name>.
# Streams (created by the orchestrator at start): AGENT_REQUEST (agent.request.>, 24 h), AGENT_FINDING (agent.finding.>, 7 d),
# AGENT_STATUS (agent.status.>, 7 d), ORCH_RUN (orchestrator.run.>, 7 d); max_msgs_per_subject unlimited; max_msg_size 64 KiB.

listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 65536

jetstream {
  store_dir: /data
  max_mem: 256MB
  max_file: 4GB
}

accounts {
  ORCHESTRATOR {
    jetstream: enabled
    users: [ { user: orchestrator, password: $ORCHESTRATOR_PASSWORD_FROM_FILE } ]
    exports: [ { stream: "agent.request.>" }, { stream: "orchestrator.run.>" } ]
    imports: [
      { stream: { account: QUALITY,     subject: "agent.finding.quality" } },     { stream: { account: QUALITY,     subject: "agent.status.quality" } },
      { stream: { account: MAINTENANCE, subject: "agent.finding.maintenance" } }, { stream: { account: MAINTENANCE, subject: "agent.status.maintenance" } },
      { stream: { account: PRODUCTION,  subject: "agent.finding.production" } },  { stream: { account: PRODUCTION,  subject: "agent.status.production" } },
      { stream: { account: MATERIAL,    subject: "agent.finding.material" } },    { stream: { account: MATERIAL,    subject: "agent.status.material" } },
      { stream: { account: LOGISTICS,   subject: "agent.finding.logistics" } },   { stream: { account: LOGISTICS,   subject: "agent.status.logistics" } }
    ]
  }
  API {
    users: [ { user: api, password: $API_PASSWORD_FROM_FILE, permissions: { publish: ["orchestrator.run.*.trigger"], subscribe: ["orchestrator.run.>"] } } ]
    imports: [ { stream: { account: ORCHESTRATOR, subject: "orchestrator.run.>" } } ]
  }
  QUALITY {
    users: [ { user: quality, password: $QUALITY_PASSWORD_FROM_FILE, permissions: { publish: ["agent.finding.quality", "agent.status.quality"], subscribe: ["agent.request.quality", "_INBOX.>"] } } ]
    exports: [ { stream: "agent.finding.quality" }, { stream: "agent.status.quality" } ]
    imports: [ { stream: { account: ORCHESTRATOR, subject: "agent.request.quality" } } ]
  }
  MAINTENANCE {
    users: [ { user: maintenance, password: $MAINTENANCE_PASSWORD_FROM_FILE, permissions: { publish: ["agent.finding.maintenance", "agent.status.maintenance"], subscribe: ["agent.request.maintenance", "_INBOX.>"] } } ]
    exports: [ { stream: "agent.finding.maintenance" }, { stream: "agent.status.maintenance" } ]
    imports: [ { stream: { account: ORCHESTRATOR, subject: "agent.request.maintenance" } } ]
  }
  PRODUCTION {
    users: [ { user: production, password: $PRODUCTION_PASSWORD_FROM_FILE, permissions: { publish: ["agent.finding.production", "agent.status.production"], subscribe: ["agent.request.production", "_INBOX.>"] } } ]
    exports: [ { stream: "agent.finding.production" }, { stream: "agent.status.production" } ]
    imports: [ { stream: { account: ORCHESTRATOR, subject: "agent.request.production" } } ]
  }
  MATERIAL {
    users: [ { user: material, password: $MATERIAL_PASSWORD_FROM_FILE, permissions: { publish: ["agent.finding.material", "agent.status.material"], subscribe: ["agent.request.material", "_INBOX.>"] } } ]
    exports: [ { stream: "agent.finding.material" }, { stream: "agent.status.material" } ]
    imports: [ { stream: { account: ORCHESTRATOR, subject: "agent.request.material" } } ]
  }
  LOGISTICS {
    users: [ { user: logistics, password: $LOGISTICS_PASSWORD_FROM_FILE, permissions: { publish: ["agent.finding.logistics", "agent.status.logistics"], subscribe: ["agent.request.logistics", "_INBOX.>"] } } ]
    exports: [ { stream: "agent.finding.logistics" }, { stream: "agent.status.logistics" } ]
    imports: [ { stream: { account: ORCHESTRATOR, subject: "agent.request.logistics" } } ]
  }
}
