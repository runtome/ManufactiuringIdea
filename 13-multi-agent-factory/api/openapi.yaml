components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform users and roles; viewer reads briefings, inspector (shift leader) acts on findings, engineer drills into evidence, manager triggers runs and asks, admin edits the registry, rules and weights (SEC-13 §5.7).

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from the previous page's `next_cursor`

    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
      description: |
        Client-generated key. Replaying a request with the same key returns the
        original result instead of performing the operation twice.

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: |
        Authenticated but not permitted. For line-scoped resources the rows are
        never retrieved in the first place — this is not response filtering.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ValidationFailed:
      description: Request was well-formed but semantically invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem details with a stable machine-readable `code`.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable error code — see API-Specification.md §7
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Language:
      type: string
      enum: [th, ja, en]
      default: th

    Shift:
      type: string
      enum: [A, B, C, OT]

    Severity:
      type: string
      enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]

    Finding:
      type: object
      properties:
        id: { type: string, format: uuid }
        agent: { type: string }
        domain: { type: string }
        scope: { type: object, additionalProperties: true }
        title: { type: string }
        summary: { type: [string, 'null'] }
        severity:
          $ref: '#/components/schemas/Severity'
        confidence: { type: [number, 'null'] }
        evidence:
          type: array
          minItems: 1
          description: A finding without evidence is rejected — enforced in the database
          items: { type: object, additionalProperties: true }
        recommended_action: { type: [string, 'null'] }
        status: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        occurrences: { type: integer }

    Briefing:
      type: object
      properties:
        id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }
        lang:
          $ref: '#/components/schemas/Language'
        partial:
          type: boolean
          description: True when a specialist agent failed or timed out
        partial_reason: { type: [string, 'null'] }
        data_freshness:
          type: object
          additionalProperties: true
          description: Age of the data each domain reported on
        top_risks:
          type: array
          items:
            type: object
            properties:
              rank: { type: integer }
              score: { type: number }
              severity: { $ref: '#/components/schemas/Severity' }
              title: { type: string }
              summary: { type: string }
              finding_ids:
                type: array
                items: { type: string, format: uuid }
              recommended_action: { type: string }
              owner: { type: [string, 'null'] }
        text: { type: string }

    RunRequest:
      type: object
      properties:
        scope:
          type: object
          description: "{plant, line?, shift?, date?}"
          additionalProperties: true
        agents:
          type: array
          description: Subset of enabled specialists (default all)
          items: { type: string }
        trigger: { type: string, enum: [on_demand, schedule], default: on_demand }
        lang: { $ref: '#/components/schemas/Language' }

    RunSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_no: { type: integer }
        trigger: { type: string, enum: [schedule, on_demand, question, scenario] }
        scope: { type: object, additionalProperties: true }
        status: { type: string, enum: [queued, running, completed, partial, failed, cancelled] }
        partial_reason: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        wall_ms: { type: [integer, 'null'] }
        agent_count: { type: integer }
        tool_call_count: { type: integer }
        token_count: { type: integer }
        weights_version: { type: string }

    Run:
      allOf:
        - { $ref: '#/components/schemas/RunSummary' }
        - type: object
          properties:
            deadline_at: { type: string, format: date-time }
            budgets: { type: object, additionalProperties: { $ref: '#/components/schemas/Budget' } }
            assessments:
              type: array
              items: { $ref: '#/components/schemas/Assessment' }
            compounds: { type: integer }
            briefings: { type: integer }
            links:
              type: object
              properties:
                trace: { type: string }
                ranking: { type: string }
                export: { type: string }

    Budget:
      type: object
      required: [tool_calls, tokens, wall_ms]
      properties:
        tool_calls: { type: integer }
        tokens: { type: integer }
        wall_ms: { type: integer }

    Assessment:
      type: object
      description: One per enabled specialist per run — silence is impossible (FR-13); over budget ⇒ budget_exceeded + incomplete (AC-05)
      properties:
        agent: { type: string }
        outcome: { type: string, enum: [findings, nothing_significant, timeout, budget_exceeded, invalid_output, failed, circuit_open] }
        incomplete: { type: boolean }
        finding_count: { type: integer }
        confidence: { type: [number, 'null'] }
        freshness_min: { type: [number, 'null'] }
        freshness_flag: { type: boolean, description: "true when older than the threshold (60 min) — shown as ⚠" }
        usage: { $ref: '#/components/schemas/Budget' }
        budget: { $ref: '#/components/schemas/Budget' }
        violation: { type: [string, 'null'], description: "e.g. tool_calls 13 > 12" }
        attempt_count: { type: integer }
        requested_at: { type: string, format: date-time }
        responded_at: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        agent_run_id: { type: [string, 'null'], format: uuid, description: The specialist's platform agent.run }

    Message:
      type: object
      properties:
        seq: { type: integer }
        ts: { type: string, format: date-time }
        type: { type: string, enum: [RequestAssessment, Finding, Clarification, Error, StatusUpdate] }
        from: { type: string }
        to: { type: string }
        subject: { type: string, description: "IF-17 subject, e.g. agent.finding.quality" }
        correlation_id: { type: string }
        payload: { type: object, additionalProperties: true }

    TraceEvent:
      type: object
      properties:
        seq: { type: integer }
        ts: { type: string, format: date-time }
        kind: { type: string, enum: [message, llm_run, tool_call, lease, attempt] }
        agent: { type: string }
        detail: { type: object, additionalProperties: true }

    RankItem:
      type: object
      properties:
        rank: { type: integer }
        kind: { type: string, enum: [finding, compound] }
        id: { type: string, format: uuid }
        score: { type: number }
        title: { type: string }
        finding_ids:
          type: array
          items: { type: string, format: uuid }
        factors:
          type: array
          description: For a finding one entry; for a compound one per component
          items: { $ref: '#/components/schemas/RiskScore' }

    RiskScore:
      type: object
      description: "score = impact × likelihood × urgency × confidence (FR-18, AI-03); recomputed by the database"
      properties:
        run_id: { type: string, format: uuid }
        run_no: { type: integer }
        finding_id: { type: string, format: uuid }
        weights_version: { type: string }
        impact: { type: number }
        likelihood: { type: number }
        urgency: { type: number }
        confidence: { type: number }
        score: { type: number }
        rank: { type: [integer, 'null'] }
        absorbed_by: { type: [string, 'null'], format: uuid, description: The compound this finding is a component of }

    CompoundRisk:
      type: object
      description: "≥ 2 findings from ≥ 2 domains sharing the rule's key; score = 1 − Π(1 − sᵢ) ≥ every component (FR-17, AC-04)"
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        rule: { type: string }
        shared_key: { type: object, additionalProperties: true }
        rationale: { type: string }
        score: { type: number }
        rank: { type: [integer, 'null'] }
        title: { type: string }
        recommended_action: { type: [string, 'null'] }
        owner_suggestion: { type: [string, 'null'] }
        components:
          type: array
          items:
            type: object
            properties:
              finding_id: { type: string, format: uuid }
              agent: { type: string }
              domain: { type: string }
              title: { type: string }
              score: { type: number }
              factors: { $ref: '#/components/schemas/RiskScore' }

    FindingDetail:
      allOf:
        - { $ref: '#/components/schemas/Finding' }
        - type: object
          properties:
            issue_code: { type: string }
            issue_key: { type: string }
            likelihood_class: { type: string, enum: [observed, trend, forecast, possible] }
            horizon: { type: string, enum: [this_shift, today, within_3_days, this_week, later] }
            freshness_min: { type: [number, 'null'] }
            stale: { type: boolean }
            impact_estimate: { type: [object, 'null'], additionalProperties: true }
            owner_suggestion: { type: [string, 'null'] }
            owner: { type: [string, 'null'] }
            snoozed_until: { type: [string, 'null'], format: date-time }
            latest_score: { type: [number, 'null'] }
            reporting_agents: { type: integer }
            resolved_at: { type: [string, 'null'], format: date-time }
            resolution: { type: [string, 'null'] }

    Occurrence:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_no: { type: integer }
        agent: { type: string }
        confidence: { type: [number, 'null'] }
        freshness_min: { type: [number, 'null'] }
        summary: { type: [string, 'null'] }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceItem' }
        ts: { type: string, format: date-time }

    EvidenceItem:
      type: object
      required: [kind, ref]
      properties:
        kind: { type: string, enum: [metric, alert, signal, case, oee, downtime, stock, po, lot, schedule, pm, health] }
        ref: { type: string }
        agent: { type: string }
        run_no: { type: integer }

    FindingAction:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [acknowledge, assign, start, snooze, dismiss, resolve, reopen] }
        actor: { type: string }
        reason: { type: [string, 'null'] }
        dismiss_reason: { type: [string, 'null'], enum: [false_positive, duplicate, known, not_actionable, not_related, null] }
        assignee: { type: [string, 'null'] }
        snooze_until: { type: [string, 'null'], format: date-time }
        from_status: { type: string }
        to_status: { type: string }
        ts: { type: string, format: date-time }

    AckRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [acknowledge, assign, start, dismiss] }
        reason: { type: string }
        dismiss_reason: { type: string, enum: [false_positive, duplicate, known, not_actionable, not_related] }
        assignee_id: { type: string, format: uuid }

    SnoozeRequest:
      type: object
      required: [until, reason]
      properties:
        until: { type: string, format: date-time }
        reason: { type: string }

    DismissRequest:
      type: object
      required: [dismiss_reason, reason]
      properties:
        dismiss_reason: { type: string, enum: [false_positive, duplicate, known, not_actionable, not_related] }
        reason: { type: string }

    ResolveRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: What was done }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    BriefingDetail:
      allOf:
        - { $ref: '#/components/schemas/Briefing' }
        - type: object
          properties:
            run_id: { type: string, format: uuid }
            run_no: { type: integer }
            scope: { type: object, additionalProperties: true }
            top_n: { type: integer }
            rank: { type: array, items: { $ref: '#/components/schemas/RankItem' } }
            claim_check: { $ref: '#/components/schemas/ClaimCheck' }
            template_fallback: { type: boolean, description: true when the phrased text failed the claim check twice and the deterministic template was used }
            deliveries: { type: array, items: { $ref: '#/components/schemas/Delivery' } }
            run_summary: { type: string, description: "Run 411 · 2 min 14 s · 4 agents · 23 tool calls" }

    ClaimCheck:
      type: object
      description: "Every numeric token in the text must occur in the cited findings or the run's metadata (FR-22, AC-07)"
      properties:
        checked: { type: integer }
        matched: { type: integer }
        unmatched:
          type: array
          items: { type: string }

    Delivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [briefing, immediate] }
        briefing_id: { type: [string, 'null'], format: uuid }
        finding_id: { type: [string, 'null'], format: uuid }
        channel: { type: string, enum: [discord, webhook, email, dashboard] }
        status: { type: string, enum: [pending, sent, failed, skipped] }
        scheduled_at: { type: string, format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        message_ref: { type: [string, 'null'] }
        error: { type: [string, 'null'] }

    DeliverRequest:
      type: object
      required: [channel]
      properties:
        channel: { type: string, enum: [discord, webhook, email, dashboard] }

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 500 }
        lang: { $ref: '#/components/schemas/Language' }
        scope: { type: object, additionalProperties: true, description: "Optional; otherwise derived from the question" }

    Answer:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_id: { type: [string, 'null'], format: uuid }
        question: { type: string }
        scope: { type: object, additionalProperties: true }
        status: { type: string, enum: [running, answered, partial, failed] }
        items: { type: array, items: { $ref: '#/components/schemas/RankItem' } }
        answer_text: { type: [string, 'null'] }
        claim_check: { $ref: '#/components/schemas/ClaimCheck' }
        asked_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }

    AgentSummary:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [specialist, manager] }
        display_name: { type: string }
        version: { type: string }
        enabled: { type: boolean }
        domains: { type: array, items: { type: string } }
        budget: { $ref: '#/components/schemas/Budget' }
        schedule_cron: { type: [string, 'null'] }
        prompt_version: { type: [string, 'null'] }

    AgentDetail:
      allOf:
        - { $ref: '#/components/schemas/AgentSummary' }
        - type: object
          properties:
            description: { type: [string, 'null'] }
            module: { type: string }
            output_schema: { type: string }
            tools: { type: array, items: { $ref: '#/components/schemas/ToolBinding' } }
            circuit: { $ref: '#/components/schemas/CircuitState' }
            updated_at: { type: string, format: date-time }

    AgentPatch:
      type: object
      properties:
        enabled: { type: boolean }
        budget: { $ref: '#/components/schemas/Budget' }
        schedule_cron: { type: [string, 'null'] }
        prompt_version: { type: string }
        tools: { type: array, items: { type: string }, description: Tool names to bind — read tools only }
        reason: { type: string }

    AgentRegistryFile:
      type: object
      description: "deploy/agents.example.yaml as JSON (IF-68)"
      required: [version, agents]
      properties:
        version: { type: integer }
        agents: { type: array, items: { type: object, additionalProperties: true } }

    CircuitState:
      type: object
      properties:
        state: { type: string, enum: [closed, open, half_open] }
        consecutive_failures: { type: integer }
        opened_at: { type: [string, 'null'], format: date-time }
        last_outcome: { type: [string, 'null'] }
        last_change_at: { type: string, format: date-time }

    AgentHealth:
      allOf:
        - { $ref: '#/components/schemas/AgentSummary' }
        - type: object
          properties:
            circuit: { $ref: '#/components/schemas/CircuitState' }
            tools: { type: integer }
            last_outcome: { type: [string, 'null'] }
            avg_wall_ms: { type: [number, 'null'] }
            avg_tokens: { type: [number, 'null'] }
            avg_tool_calls: { type: [number, 'null'] }
            failures: { type: integer }

    ToolBinding:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [read] }
        provider: { type: string }
        min_role: { type: string }
        timeout_ms: { type: integer }
        ordinal: { type: integer }

    AgentMetric:
      type: object
      properties:
        agent: { type: string }
        date: { type: string, format: date }
        runs: { type: integer }
        failures: { type: integer }
        timeouts: { type: integer }
        budget_exceeded: { type: integer }
        findings: { type: integer }
        dismissed: { type: integer }
        false_positives: { type: integer }
        avg_latency_ms: { type: [integer, 'null'] }
        tokens: { type: integer }
        tool_calls: { type: integer }

    Precision:
      type: object
      properties:
        agent: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        findings: { type: integer }
        dismissed: { type: integer }
        false_positives: { type: integer }
        precision_rate: { type: [number, 'null'] }

    RelationRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        match_keys: { type: array, items: { type: string, enum: [plant, line, machine, sku, lot, shift] } }
        min_domains: { type: integer, minimum: 2 }
        window_hours: { type: integer }
        enabled: { type: boolean }
        description: { type: [string, 'null'] }

    RelationRuleInput:
      type: object
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        match_keys: { type: array, minItems: 1, items: { type: string, enum: [plant, line, machine, sku, lot, shift] } }
        min_domains: { type: integer, minimum: 2 }
        window_hours: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        description: { type: string }

    ScoringWeights:
      type: object
      description: "IF-70 — impact by severity, likelihood by class, urgency by horizon; monotone; ≤ 1"
      properties:
        version: { type: string }
        impact: { type: object, additionalProperties: { type: number } }
        likelihood: { type: object, additionalProperties: { type: number } }
        urgency: { type: object, additionalProperties: { type: number } }
        active: { type: boolean }
        published_at: { type: string, format: date-time }
        published_by: { type: [string, 'null'] }
        note: { type: [string, 'null'] }

    WeightsInput:
      type: object
      required: [version, impact, likelihood, urgency]
      properties:
        version: { type: string, pattern: "^v[0-9]+$" }
        impact: { type: object, required: [INFO, LOW, MEDIUM, HIGH, CRITICAL], additionalProperties: { type: number, minimum: 0, maximum: 1 } }
        likelihood: { type: object, required: [observed, trend, forecast, possible], additionalProperties: { type: number, minimum: 0, maximum: 1 } }
        urgency: { type: object, required: [this_shift, today, within_3_days, this_week, later], additionalProperties: { type: number, minimum: 0, maximum: 1 } }
        note: { type: string }

    Scenario:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        plant_state: { type: object, additionalProperties: true }
        findings: { type: array, items: { type: object, additionalProperties: true } }
        expected_top: { type: array, items: { type: string } }
        notes: { type: [string, 'null'] }

    ScenarioSuiteFile:
      type: object
      description: "deploy/scenarios/suite.example.yaml as JSON (IF-71)"
      required: [suite, version, weights_version, gate, scenarios]
      properties:
        suite: { type: string }
        version: { type: integer }
        weights_version: { type: string }
        gate: { type: object, additionalProperties: true }
        scenarios: { type: array, minItems: 15, items: { type: object, additionalProperties: true } }

    SuiteRunRequest:
      type: object
      properties:
        weights_version: { type: string, description: Default the active version }
        mode: { type: string, enum: [deterministic, full], default: deterministic }

    SuiteRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        weights_version: { type: string }
        mode: { type: string, enum: [deterministic, full] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        scenarios: { type: integer }
        matches: { type: integer }
        match_rate: { type: [number, 'null'] }
        fabricated: { type: integer }
        passed: { type: [boolean, 'null'] }
        gate_top3: { type: number }
        mismatches: { type: array, items: { type: string } }
        results:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              computed_top: { type: array, items: { type: string } }
              expected_top: { type: array, items: { type: string } }
              top3_match: { type: boolean }
              fabricated_count: { type: integer }

    Export:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [run, findings, briefing, audit] }
        run_id: { type: [string, 'null'], format: uuid }
        from_ts: { type: [string, 'null'], format: date-time }
        to_ts: { type: [string, 'null'], format: date-time }
        row_count: { type: integer }
        sha256: { type: string }
        uri: { type: string }
        created_at: { type: string, format: date-time }

    ExportRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [findings, briefing, audit] }
        from_ts: { type: string, format: date-time }
        to_ts: { type: string, format: date-time }

    RunExport:
      type: object
      description: "deploy/schemas/run-export.schema.json (IF-72)"
      required: [run, assessments, messages, tool_calls, leases, attempts, ranking, message_log_sha256]
      properties:
        run: { $ref: '#/components/schemas/RunSummary' }
        assessments: { type: array, items: { $ref: '#/components/schemas/Assessment' } }
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        tool_calls: { type: array, items: { type: object, additionalProperties: true } }
        leases: { type: array, items: { type: object, additionalProperties: true } }
        attempts: { type: array, items: { type: object, additionalProperties: true } }
        ranking: { type: array, items: { $ref: '#/components/schemas/RankItem' } }
        message_log_sha256: { type: string }

    Config:
      type: object
      properties:
        agent_timeout_s: { type: integer }
        run_wall_s: { type: integer }
        max_attempts: { type: integer }
        backoff_base_ms: { type: integer }
        backoff_cap_ms: { type: integer }
        circuit_threshold: { type: integer }
        circuit_cooldown_min: { type: integer }
        freshness_threshold_min: { type: integer }
        top_n: { type: integer }
        expire_after_runs: { type: integer }
        semaphore_slots: { type: integer, enum: [1] }
        llm: { type: object, properties: { model: { type: string }, max_params_b: { type: number }, temperature: { type: number } } }
        scenario_gate: { type: object, properties: { top3_match_min: { type: number }, fabricated_max: { type: integer } } }
        retention_days: { type: integer }
        briefing_langs: { type: array, items: { $ref: '#/components/schemas/Language' } }
        active_weights: { type: string }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ready, degraded, not_ready] }
        mode: { type: string, enum: [normal, no_model, no_bus, no_db] }
        checks:
          type: object
          additionalProperties: { type: string }
