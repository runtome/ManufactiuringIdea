openapi: 3.1.0
info:
  title: KaizenSwarm API
  version: 1.0.0
  summary: Specialist agents assess their domains with read-only tools; the Manager deduplicates, relates, ranks with a published scoring function and phrases a claim-checked shift briefing; a failed domain makes the briefing partial, never absent.
  description: |
    **Scope.** The KaizenSwarm API — standalone, and the `agent.finding*` module of FactoryBrain in platform mode.
    SRS-13 §4.1's seven paths are kept verbatim under `/api/v1` (`/runs`, `/runs/{id}`, `/findings`, `/findings/{id}/ack`,
    `/briefing`, `/manager/ask`, `/agents`). The platform's `/agent/findings` and `/agent/briefing` and their components
    (`Finding`, `Briefing`, `Severity`, `Shift`, `Language`, `Problem`, the standard parameters and error responses) are
    copied byte-for-byte from API-00 and diffed by TEST-13 TC-008; in platform mode they are served by the gateway.

    **Five contracts (API-Specification.md §3–§7):**
    - **Finding** — evidence or rejection; one active finding per issue key with occurrences per agent and run; lifecycle
      changes only through actions with reasons (`409 ACTION_REQUIRED` otherwise).
    - **Run** — scheduled, on-demand or question; per-agent budgets enforced by the orchestrator; every enabled specialist
      ends with an assessment; `partial` names the failed domain; a run is never silently truncated.
    - **Ranking** — `score = impact × likelihood × urgency × confidence` from a published weights version; compounds from
      relation rules by noisy-OR; every factor is returned so the rank can be checked by hand.
    - **Briefing** — top-N with finding ids, owners and evidence; the text is claim-checked against the cited findings
      (`422 BRIEFING_UNGROUNDED` is a server-side refusal, never a warning); en / th / ja.
    - **Trace & export** — every message, tool call, lease and attempt of a run; a hash over the message log.

    Errors are RFC 7807 `application/problem+json` with a stable `code`.
  contact: { name: Suphot N. }
  license: { name: Proprietary }
  x-document-id: API-13-KaizenSwarm

servers:
  - url: https://kaizenswarm.plant.local/api/v1
    description: Standalone
  - url: https://factorybrain.plant.local/api/v1
    description: Platform mode (the platform's two paths are served by the gateway; the rest under /swarm/)

security:
  - bearerAuth: []

tags:
  - { name: runs, description: "SRS §4.1 /runs — trigger, status, trace, assessments, ranking, export (FR-03, FR-07, AC-09)" }
  - { name: findings, description: "SRS §4.1 /findings — the blackboard, occurrences, evidence, lifecycle actions (FR-23…FR-27)" }
  - { name: compounds, description: "Cross-domain compounds with their components and factors (FR-17, AI-04)" }
  - { name: briefing, description: "SRS §4.1 /briefing — briefings, claim check, deliveries (FR-19, FR-20, FR-28, FR-31)" }
  - { name: manager, description: "SRS §4.1 /manager/ask — cross-domain questions (FR-21)" }
  - { name: agents, description: "SRS §4.1 /agents — registry, health, circuit, tools, metrics, precision (FR-01, FR-06, FR-26, FR-30)" }
  - { name: rules, description: "Relation rules and scoring weights — the inspectable ranking (FR-18, AI-03, AI-04)" }
  - { name: scenarios, description: "The scenario suite and its gate (AI-06, AC-01)" }
  - { name: exports, description: "Audit exports (NFR-05)" }
  - { name: agent, description: "Platform paths (API-00, verbatim)" }
  - { name: admin, description: "Configuration" }
  - { name: system, description: "Health, readiness, metrics" }

paths:
  # ---------------------------------------------------------------- SRS-13 §4.1 — verbatim paths
  /runs:
    post:
      tags: [runs]
      operationId: triggerRun
      summary: "Trigger an orchestration run (SRS §4.1; FR-03, FR-15)"
      description: |
        Creates `swarm.run` and publishes `RequestAssessment` to every enabled specialist (or the `agents` subset) with
        the run's budgets. Returns `202` with the run; poll `GET /runs/{id}`. Budgets, timeouts and the GPU lease are
        enforced by the orchestrator (C-04, C-05); a failed agent degrades the run to `partial` (C-06).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [runs]
      operationId: listRuns
      summary: Runs, newest first
      parameters:
        - { name: status, in: query, description: "queued | running | completed | partial | failed | cancelled", schema: { type: string } }
        - { name: trigger, in: query, description: "schedule | on_demand | question | scenario", schema: { type: string } }
        - { name: date, in: query, description: "Plant-local date", schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RunSummary' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: "Run status and trace summary (SRS §4.1; FR-07)"
      description: Status, partial reason, one assessment per enabled specialist with usage against budget, totals, and links to the full trace.
      parameters:
        - { name: id, in: path, required: true, description: "Run id (uuid) or run number", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /findings:
    get:
      tags: [findings]
      operationId: queryFindings
      summary: "Blackboard query (SRS §4.1; FR-23)"
      description: Active and historical findings with issue key, factors, latest score, occurrences and reporting agents. The caller's line scope applies.
      parameters:
        - { name: status, in: query, description: "new | acknowledged | in_progress | resolved | expired | dismissed", schema: { type: string } }
        - { name: severity, in: query, description: "INFO | LOW | MEDIUM | HIGH | CRITICAL", schema: { type: string } }
        - { name: agent, in: query, description: "Reporting agent", schema: { type: string } }
        - { name: line, in: query, description: "Scope line", schema: { type: integer } }
        - { name: issue_code, in: query, description: "family.kind", schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FindingDetail' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /findings/{id}/ack:
    post:
      tags: [findings]
      operationId: ackFinding
      summary: "Acknowledge / assign / dismiss a finding (SRS §4.1; FR-25)"
      description: |
        One action row (`swarm.finding_action`) that performs the transition. `dismiss` needs `dismiss_reason` and `reason`
        (feeds the precision report, FR-26); `assign` needs `assignee_id`. A status cannot be changed any other way
        (`409 ACTION_REQUIRED` on direct updates).
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
      responses:
        '200':
          description: The finding after the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "LIFECYCLE_TRANSITION — the transition is not allowed from the current status; REOPEN_ONLY_TERMINAL", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /briefing:
    get:
      tags: [briefing]
      operationId: getShiftBriefing
      summary: "The briefing for a date and shift (SRS §4.1; FR-19, FR-20, FR-31)"
      description: |
        Top-N risks with scores, severities, finding ids, owners, evidence and the phrased text in the requested language;
        `partial` and `partial_reason` when a domain failed; data freshness per domain; the claim-check result.
      parameters:
        - { name: date, in: query, description: "Plant-local date (default today)", schema: { type: string, format: date } }
        - { name: shift, in: query, description: "A | B | C | OT (default the current shift)", schema: { type: string } }
        - { name: lang, in: query, description: "th | ja | en (default the caller language)", schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /manager/ask:
    post:
      tags: [manager]
      operationId: askManager
      summary: "Ask a cross-domain question (SRS §4.1; FR-21)"
      description: |
        The Manager maps the question to a scope, requests targeted assessments from the enabled specialists (a run with
        `trigger = question`), and answers with the ranked list for that scope. The answer text is claim-checked like a
        briefing; the Manager never adds a claim (FR-22). Returns `202` with the question while the run is in progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '202':
          description: Question accepted; poll /manager/questions/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: "Registry and health (SRS §4.1; FR-01, FR-30)"
      description: Every registered agent with domains, tools, budget, schedule, circuit state, last outcome and averages.
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ---------------------------------------------------------------- Platform paths (API-00, verbatim)
  /agent/findings:
    get:
      tags: [agent]
      summary: Cross-domain findings blackboard
      operationId: listFindings
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, acknowledged, in_progress, resolved, expired, dismissed]
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
        - name: domain
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Finding'
  /agent/briefing:
    get:
      tags: [agent]
      summary: Multi-agent shift briefing with ranked risks
      description: |
        `partial: true` means at least one specialist agent failed or timed
        out; `partial_reason` names the domain. A briefing that silently omits
        a failed domain would be worse than none.
      operationId: getBriefing
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: shift
          in: query
          schema:
            $ref: '#/components/schemas/Shift'
        - name: lang
          in: query
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: Briefing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Briefing'
  # ---------------------------------------------------------------- Runs
  /runs/{id}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a running run
      description: Outstanding assessments become `failed` with reason `cancelled`; no briefing is produced.
      parameters:
        - { name: id, in: path, required: true, description: "Run id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "RUN_FINISHED — the run already ended", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /runs/{id}/trace:
    get:
      tags: [runs]
      operationId: getRunTrace
      summary: "Full trace — messages, LLM runs, tool calls, leases, attempts in time order (FR-07, AC-09)"
      parameters:
        - { name: id, in: path, required: true, description: "Run id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TraceEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{id}/messages:
    get:
      tags: [runs]
      operationId: listRunMessages
      summary: The typed bus messages of a run (C-01, FR-02)
      parameters:
        - { name: id, in: path, required: true, description: "Run id", schema: { type: string, format: uuid } }
        - { name: type, in: query, description: "RequestAssessment | Finding | Clarification | Error | StatusUpdate", schema: { type: string } }
        - { name: agent, in: query, description: "From or to this agent", schema: { type: string } }
      responses:
        '200':
          description: Messages in seq order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{id}/assessments:
    get:
      tags: [runs]
      operationId: listRunAssessments
      summary: One assessment per enabled specialist, with usage against budget (C-04, FR-13, AC-05)
      parameters:
        - { name: id, in: path, required: true, description: "Run id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Assessments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Assessment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{id}/ranking:
    get:
      tags: [runs]
      operationId: getRunRanking
      summary: The ordered list — compounds and findings with every factor (FR-18, AI-03)
      parameters:
        - { name: id, in: path, required: true, description: "Run id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ranked items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RankItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{id}/export:
    get:
      tags: [runs, exports]
      operationId: exportRun
      summary: "Run trace export (IF-72; NFR-05, AC-09)"
      description: The JSON shape of `deploy/schemas/run-export.schema.json`; the `message_log_sha256` equals the stored `swarm.export.sha256`.
      parameters:
        - { name: id, in: path, required: true, description: "Run id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunExport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ---------------------------------------------------------------- Findings
  /findings/{id}:
    get:
      tags: [findings]
      operationId: getFinding
      summary: A finding with its extension, latest factors, occurrences and actions
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /findings/{id}/occurrences:
    get:
      tags: [findings]
      operationId: listOccurrences
      summary: Every detection with its own evidence set (AC-03, AC-08)
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Occurrences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Occurrence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /findings/{id}/evidence:
    get:
      tags: [findings]
      operationId: listEvidence
      summary: The union of evidence items with the agent and run that supplied each (C-02)
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Evidence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EvidenceItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /findings/{id}/scores:
    get:
      tags: [findings]
      operationId: listFindingScores
      summary: The finding's score in every run it occurred in, with factors and weights version
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RiskScore' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /findings/{id}/actions:
    get:
      tags: [findings]
      operationId: listFindingActions
      summary: The action history (FR-25)
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FindingAction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /findings/{id}/snooze:
    post:
      tags: [findings]
      operationId: snoozeFinding
      summary: Snooze until a time; status unchanged, no reminders until then (FR-25)
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnoozeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "SNOOZE_UNTIL — must be in the future", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /findings/{id}/dismiss:
    post:
      tags: [findings]
      operationId: dismissFinding
      summary: Dismiss with a reason code (FR-25, FR-26)
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DismissRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "LIFECYCLE_TRANSITION", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /findings/{id}/resolve:
    post:
      tags: [findings]
      operationId: resolveFinding
      summary: Resolve with what was done (FR-23)
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "LIFECYCLE_TRANSITION", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /findings/{id}/reopen:
    post:
      tags: [findings]
      operationId: reopenFinding
      summary: Reopen a resolved, expired or dismissed finding
      parameters:
        - { name: id, in: path, required: true, description: "Finding id", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "REOPEN_ONLY_TERMINAL", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  # ---------------------------------------------------------------- Compounds
  /compounds:
    get:
      tags: [compounds]
      operationId: listCompounds
      summary: Compounds of a run with rule, shared key, rationale and components (FR-17)
      parameters:
        - { name: run_id, in: query, description: "Run id", schema: { type: string, format: uuid } }
