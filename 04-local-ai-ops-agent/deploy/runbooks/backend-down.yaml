# Runbook: backend-down — the FR-24 example. Runs WITHOUT the LLM (NFR-06).
# Steps are registry tools only; the restart step is a write tool and therefore creates a proposal
# that a human approves (or, on staging with auto_execute, executes with an audit row).
name: backend-down
version: 1
description: "Backend unreachable: containers -> logs -> resources -> health -> restart (approval) -> verify"
params:
  target:  { type: string, default: vps-1,   description: "Docker host target code" }
  service: { type: string, default: backend, description: "Container / compose service name" }
  health:  { type: string, default: backend-health, description: "HTTP target code" }
steps:
  - id: ps
    tool: docker_ps
    args: { target: "{{ params.target }}", all: true }
  - id: logs
    tool: docker_logs
    args: { target: "{{ params.target }}", service: "{{ params.service }}", since: "10m", max_lines: 500 }
  - id: mem
    tool: host_metrics
    args: { target: "{{ params.target }}" }
  - id: health
    tool: service_health
    args: { target: "{{ params.health }}" }
  - id: restart
    tool: restart_container
    args: { target: "{{ params.target }}", service: "{{ params.service }}" }
    when: "health.status != 200 or ps.containers[params.service].status != 'running'"
    approval: true
    on_fail: stop
  - id: verify
    tool: service_health
    args: { target: "{{ params.health }}" }
    when: "restart.executed"
    timeout_s: 30
