# GAPFarm — Mosquitto 2 configuration (ICD-12 IF-12.1). Sensor network only; no anonymous access; per-device credentials and ACL.
per_listener_settings true

# Field devices: TLS on 8883 (certificates under /mosquitto/certs, mounted read-only; OPS-12 §5.1)
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
max_connections 500
max_inflight_messages 20
message_size_limit 4096

# Ingest side: plain MQTT on the isolated sensors network (compose), still authenticated
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistence keeps QoS 1 messages while ingest-mqtt is down (NFR-07 — together with the ingest buffer ≥ 24 h)
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
queue_qos0_messages false
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# ACL model (generated by `gapfarm sensors acl-sync`, OPS-12 §5.1):
#   user <device_code>   topic write farm/<farm_code>/<zone_code>/<signal>      (its own topic only; no read)
#   user ingest          topic read  farm/#
# A device that publishes elsewhere is refused by the broker (TEST-12 TC-091).
