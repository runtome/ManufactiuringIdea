# QE-Agent — docker-compose.yml (standalone; OPS-09 §4)
# Profiles:  gpu (Ollama on CUDA) | cpu (Ollama on CPU) | dev (mailpit, source stubs)
#   docker compose --profile gpu up -d
#   docker compose --profile cpu --profile dev up -d
# Networks:  frontend (reverse proxy → web/api) · internal (no egress: postgres, redis, minio, ollama, spc-engine, signal-detector,
#            correlator, drafter, indexer, exporter) · sources (read-only feeds: spc-engine, signal-detector, correlator, scheduler)
#            egress (ONLY api and scheduler: Discord / SMTP notifications — statistics and links only, SEC-Q41)
# Secrets are FILES under ${SECRETS_DIR} (OPS-09 §4.2) — never in this file or in .env (TEST-09 TC-004).
# Platform mode (SAD-09 §9): the analytics containers join the platform compose; postgres/redis/minio/ollama are the platform's.

x-hardened: &hardened
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

x-app-env: &app-env
  TZ: ${TZ}
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
  S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
  S3_BUCKET_CHARTS: ${S3_BUCKET_CHARTS}
  S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS}
  S3_BUCKET_GOLDEN: ${S3_BUCKET_GOLDEN}
  CONFIG_DIR: /etc/qe
  LOG_LEVEL: ${LOG_LEVEL}

x-engine-env: &engine-env
  <<: *app-env
  DATABASE_URL_FILE: /run/secrets/engine_database_url      # role engine_rw (DDS-09 §8) — cannot approve or touch approvals
  SOURCE_INSPECTION_URL_FILE: /run/secrets/source_inspection_url   # read-only accounts (IF-49, SEC-Q43)
  SOURCE_PRODUCTION_URL_FILE: /run/secrets/source_production_url
  SOURCE_TELEMETRY_URL_FILE: /run/secrets/source_telemetry_url
  SOURCE_CMMS_URL_FILE: /run/secrets/source_cmms_url
  SOURCE_ERP_URL_FILE: /run/secrets/source_erp_url
  REFRESH_INSPECTION_S: ${REFRESH_INSPECTION_S}

services:
  # ------------------------------------------------------------------ edge
  web:
    <<: *hardened
    image: ${QE_REGISTRY}/web:${QE_VERSION}
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      API_URL: http://api:8080
      DEFAULT_LOCALE: ${DEFAULT_LOCALE}
    ports: ["${BIND_ADDR}:${WEB_PORT}:3000"]
    depends_on: [api]
    networks: [frontend]

  api:
    <<: *hardened
    image: ${QE_REGISTRY}/api:${QE_VERSION}
    environment:
      <<: *app-env
      PUBLIC_URL: ${PUBLIC_URL}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      URL_SIGNING_KEY_FILE: /run/secrets/url_signing_key
      SMTP_URL_FILE: /run/secrets/smtp_url
      DISCORD_WEBHOOK_FILE: /run/secrets/discord_webhook
      MAIL_FROM: ${MAIL_FROM}
      SIGNED_URL_TTL_S: ${SIGNED_URL_TTL_S}
      APPROVALS_ENABLED: ${APPROVALS_ENABLED}
      METRICS_ENABLED: "true"
    secrets: [database_url, s3_access_key, s3_secret_key, jwt_secret, url_signing_key, smtp_url, discord_webhook]
    volumes:
      - ${CONFIG_DIR}:/etc/qe:ro
    ports: ["${BIND_ADDR}:${API_PORT}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [frontend, internal, egress]

  # ------------------------------------------------------------------ analytics engine (C-02: statistics are code)
  spc-engine:
    <<: *hardened
    image: ${QE_REGISTRY}/spc-engine:${QE_VERSION}
    environment:
      <<: *engine-env
      CONSTANTS_TABLE: ${CONSTANTS_TABLE}
      WORKERS: ${ENGINE_WORKERS}
    secrets: [engine_database_url, s3_access_key, s3_secret_key, source_inspection_url, source_production_url, source_telemetry_url, source_cmms_url, source_erp_url]
    volumes:
      - ${CONFIG_DIR}:/etc/qe:ro
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "${ENGINE_CPUS}"
          memory: ${ENGINE_MEMORY}
    networks: [internal, sources]

  signal-detector:
    <<: *hardened
    image: ${QE_REGISTRY}/signal-detector:${QE_VERSION}
    environment:
      <<: *engine-env
      DETECT_INTERVAL_S: ${DETECT_INTERVAL_S}
    secrets: [engine_database_url, s3_access_key, s3_secret_key, source_inspection_url, source_production_url, source_telemetry_url, source_cmms_url, source_erp_url]
    volumes:
      - ${CONFIG_DIR}:/etc/qe:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal, sources]

  correlator:
    <<: *hardened
    image: ${QE_REGISTRY}/correlator:${QE_VERSION}
    environment:
      <<: *engine-env
      ANALYZE_TIMEOUT_S: ${ANALYZE_TIMEOUT_S}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      OLLAMA_URL: http://ollama:11434
    secrets: [engine_database_url, s3_access_key, s3_secret_key, source_inspection_url, source_production_url, source_telemetry_url, source_cmms_url, source_erp_url]
    volumes:
      - ${CONFIG_DIR}:/etc/qe:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    deploy:
      resources:
        limits:
          cpus: "${ENGINE_CPUS}"
          memory: ${ENGINE_MEMORY}
    networks: [internal, sources]

  # ------------------------------------------------------------------ drafting (IF-09 / IF-51) — facts object in, prose out, no tools
  drafter:
    <<: *hardened
    image: ${QE_REGISTRY}/drafter:${QE_VERSION}
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/engine_database_url
      OLLAMA_URL: http://ollama:11434
      DRAFT_MODEL: ${DRAFT_MODEL}
      DRAFT_TIMEOUT_S: ${DRAFT_TIMEOUT_S}
      PROMPTS_DIR: /etc/qe/prompts
      FACTS_SCHEMA: /etc/qe/schemas/facts-object.schema.json
    secrets: [engine_database_url, s3_access_key, s3_secret_key]
    volumes:
      - ${CONFIG_DIR}:/etc/qe:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal]

  indexer:
    <<: *hardened
    image: ${QE_REGISTRY}/indexer:${QE_VERSION}
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/engine_database_url
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    secrets: [engine_database_url, s3_access_key, s3_secret_key]
    volumes:
      - ${CONFIG_DIR}:/etc/qe:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  # ------------------------------------------------------------------ exports (IF-50) — templates, watermark, version stamp; never recomputes
  exporter:
    <<: *hardened
    image: ${QE_REGISTRY}/exporter:${QE_VERSION}
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/exporter_database_url     # role exporter_ro
      TEMPLATES_DIR: /etc/qe/templates
      LIBREOFFICE_TIMEOUT_S: ${LIBREOFFICE_TIMEOUT_S}
    secrets: [exporter_database_url, s3_access_key, s3_secret_key]
    volumes:
      - ${CONFIG_DIR}:/etc/qe:ro
    tmpfs: [/tmp, /home/exporter/.config]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [internal]

  # ------------------------------------------------------------------ scheduler — daily signals, escalation (FR-31), golden runs (AI-05), retention
  scheduler:
    <<: *hardened
    image: ${QE_REGISTRY}/scheduler:${QE_VERSION}
    environment:
      <<: *engine-env
      SMTP_URL_FILE: /run/secrets/smtp_url
      DISCORD_WEBHOOK_FILE: /run/secrets/discord_webhook
      MAIL_FROM: ${MAIL_FROM}
      DAILY_SIGNAL_CRON: ${DAILY_SIGNAL_CRON}
      ESCALATION_CRON: ${ESCALATION_CRON}
      GOLDEN_RUN_CRON: ${GOLDEN_RUN_CRON}
      RETENTION_CRON: ${RETENTION_CRON}
    secrets: [engine_database_url, s3_access_key, s3_secret_key, smtp_url, discord_webhook, source_inspection_url, source_production_url, source_telemetry_url, source_cmms_url, source_erp_url]
    volumes:
      - ${CONFIG_DIR}:/etc/qe:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal, sources, egress]

  # ------------------------------------------------------------------ data
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: ${TZ}
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS}", "-c", "wal_level=replica", "-c", "log_min_duration_statement=2000"]
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY}", "--maxmemory-policy", "allkeys-lru"]
    networks: [internal]

  minio:
    image: minio/minio:${MINIO_VERSION}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio-init:
    image: minio/mc:${MINIO_MC_VERSION}
    entrypoint: ["/bin/sh", "-c"]
    # exports and golden runs are immutable objects (IF-10): versioning + object lock in governance mode; charts are regenerable
    command:
      - >
        mc alias set local http://minio:9000 "$(cat /run/secrets/s3_access_key)" "$(cat /run/secrets/s3_secret_key)" &&
        mc mb --ignore-existing local/${S3_BUCKET_CHARTS} &&
        mc mb --ignore-existing --with-lock local/${S3_BUCKET_EXPORTS} &&
        mc retention set --default GOVERNANCE 3650d local/${S3_BUCKET_EXPORTS} &&
        mc mb --ignore-existing --with-lock local/${S3_BUCKET_GOLDEN} &&
        mc retention set --default GOVERNANCE 1825d local/${S3_BUCKET_GOLDEN} &&
        mc ilm rule add --expire-days ${CHARTS_EXPIRE_DAYS} local/${S3_BUCKET_CHARTS}
    secrets: [s3_access_key, s3_secret_key]
    depends_on:
      minio: { condition: service_healthy }
    networks: [internal]

  # ------------------------------------------------------------------ model runtime (IF-09) — no route out; no tools
  ollama:
    profiles: [gpu]
    image: ollama/ollama:${OLLAMA_VERSION}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT}
              capabilities: [gpu]
    networks: [internal]

  ollama-cpu:
    profiles: [cpu]
    image: ollama/ollama:${OLLAMA_VERSION}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_THREAD: ${CPU_THREADS}
    volumes:
      - ollama:/root/.ollama
    networks:
      internal:
        aliases: [ollama]

  # ------------------------------------------------------------------ dev only
  mailpit:
    profiles: [dev]
    image: axllent/mailpit:${MAILPIT_VERSION}
    ports: ["${BIND_ADDR}:8025:8025"]
    networks: [internal, egress]

  source-stub:
    profiles: [dev]
    image: ${QE_REGISTRY}/source-stub:${QE_VERSION}     # serves the seed's inspection/production/CMMS feeds read-only (TEST-09 E1)
    networks: [sources]

networks:
  frontend: {}
  internal:
    internal: true
  sources:
    internal: true
  egress: {}

volumes:
  pgdata: {}
  miniodata: {}
  ollama: {}

secrets:
  database_url:          { file: "${SECRETS_DIR}/database_url" }            # app_rw
  engine_database_url:   { file: "${SECRETS_DIR}/engine_database_url" }     # engine_rw
  exporter_database_url: { file: "${SECRETS_DIR}/exporter_database_url" }   # exporter_ro
  postgres_password:     { file: "${SECRETS_DIR}/postgres_password" }
  jwt_secret:            { file: "${SECRETS_DIR}/jwt_secret" }
  url_signing_key:       { file: "${SECRETS_DIR}/url_signing_key" }
  s3_access_key:         { file: "${SECRETS_DIR}/s3_access_key" }
  s3_secret_key:         { file: "${SECRETS_DIR}/s3_secret_key" }
  smtp_url:              { file: "${SECRETS_DIR}/smtp_url" }
  discord_webhook:       { file: "${SECRETS_DIR}/discord_webhook" }
  source_inspection_url: { file: "${SECRETS_DIR}/source_inspection_url" }
  source_production_url: { file: "${SECRETS_DIR}/source_production_url" }
  source_telemetry_url:  { file: "${SECRETS_DIR}/source_telemetry_url" }
  source_cmms_url:       { file: "${SECRETS_DIR}/source_cmms_url" }
  source_erp_url:        { file: "${SECRETS_DIR}/source_erp_url" }
