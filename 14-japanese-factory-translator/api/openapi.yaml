components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform users; GenbaGo roles translator / reviewer / admin are rows (FR-30); viewers read.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from the previous page's `next_cursor`

    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
      description: |
        Client-generated key. Replaying a request with the same key returns the
        original result instead of performing the operation twice.

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: |
        Authenticated but not permitted. For line-scoped resources the rows are
        never retrieved in the first place — this is not response filtering.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ValidationFailed:
      description: Request was well-formed but semantically invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem details with a stable machine-readable `code`.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable error code — see API-Specification.md §7
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Language:
      type: string
      enum: [th, ja, en]
      default: th

    TranslationResult:
      type: object
      properties:
        source_text: { type: string }
        source_lang:
          $ref: '#/components/schemas/Language'
        translation: { type: string }
        target_lang:
          $ref: '#/components/schemas/Language'
        tm_match:
          type: [object, 'null']
          properties:
            score: { type: number }
            segment_id: { type: string, format: uuid }
        glossary_applied:
          type: array
          items: { type: string }
        checks:
          type: object
          properties:
            numbers_preserved: { type: boolean }
            glossary_compliant: { type: boolean }
            omission_suspected: { type: boolean }
        interpretation:
          type: [object, 'null']
          description: |
            INFERRED, and kept separate from the translation itself so a reader
            can always tell what was said from what the system deduced.
          properties:
            inferred: { type: boolean, enum: [true] }
            confidence: { type: number }
            process: { type: string }
            message_type: { type: string }
            entities: { type: object, additionalProperties: true }
            suggested_checks:
              type: array
              items: { type: string }
            related_documents:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  document_id: { type: string, format: uuid }
            possible_readings:
              type: array
              items: { type: string }
              description: Populated when the source is ambiguous, instead of choosing silently

    TranslateRequest:
      type: object
      required: [text, target_lang]
      properties:
        text: { type: string, maxLength: 20000 }
        source_lang: { $ref: '#/components/schemas/Language' }
        target_lang: { $ref: '#/components/schemas/Language' }
        register: { type: string, enum: [report, shopfloor, customer], default: report }
        interpret: { type: boolean, default: true }
        confidential: { type: boolean, default: true, description: "false only for texts that may leave the LAN (Discord)" }
        domain: { type: string }

    TranslateResponse:
      allOf:
        - { $ref: '#/components/schemas/TranslationResult' }
        - type: object
          properties:
            job_id: { type: string, format: uuid }
            segments:
              type: array
              items: { $ref: '#/components/schemas/Segment' }
            interpretation_detail: { $ref: '#/components/schemas/Interpretation' }
            rendered: { type: string, description: "The two-part text rendering (AC-08)" }

    JobRequest:
      type: object
      description: "deploy/schemas/translation-job.schema.json (IF-77)"
      required: [kind, source_lang, target_lang]
      properties:
        kind: { type: string, enum: [text, document, ocr, hmi, batch] }
        source_lang: { $ref: '#/components/schemas/Language' }
        target_lang: { $ref: '#/components/schemas/Language' }
        register: { type: string, enum: [report, shopfloor, customer], default: report }
        confidential: { type: boolean, default: true }
        provider: { type: string, enum: [local, cloud], default: local }
        channel: { type: string, enum: [web, api, discord, tool, batch], default: web }
        format: { type: string, enum: [text, docx, xlsx, pptx, pdf, image] }
        keep_layout: { type: boolean, default: true }
        layout_mode: { type: string, enum: [side_by_side, overlay, keep_layout] }
        file_uri: { type: string }
        files:
          type: array
          items:
            type: object
            required: [name, uri, format]
            properties:
              name: { type: string }
              uri: { type: string }
              format: { type: string, enum: [docx, xlsx, pptx, pdf, image, text] }
        text: { type: string }
        interpret: { type: boolean, default: true }
        domain: { type: string }

    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [text, document, ocr, hmi, batch] }
        source_lang: { $ref: '#/components/schemas/Language' }
        target_lang: { $ref: '#/components/schemas/Language' }
        register: { type: string, enum: [report, shopfloor, customer] }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        confidential: { type: boolean }
        provider: { type: string, enum: [local, cloud] }
        channel: { type: string, enum: [web, api, discord, tool, batch] }
        format: { type: string }
        keep_layout: { type: boolean }
        file_uri: { type: [string, 'null'] }
        result_uri: { type: [string, 'null'] }
        created_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        segment_count: { type: integer }
        done_count: { type: integer }
        blocked: { type: integer }
        flagged: { type: integer }
        tm_exact: { type: integer }
        files: { type: integer }
        files_done: { type: integer }
        files_failed: { type: integer }
        resumed_from_ordinal: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }

    JobFile:
      type: object
      properties:
        ordinal: { type: integer }
        name: { type: string }
        uri: { type: string }
        format: { type: string }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        segment_count: { type: integer }
        error: { type: [string, 'null'] }
        result_uri: { type: [string, 'null'] }

    JobResult:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        result_uri: { type: [string, 'null'], description: "Translated document / side-by-side PDF / keep-layout image in the local store" }
        report:
          type: object
          properties:
            segments: { type: integer }
            approved: { type: integer }
            blocked: { type: integer }
            flagged: { type: integer }
            tm_exact: { type: integer }
            files: { type: array, items: { $ref: '#/components/schemas/JobFile' } }

    OcrRequest:
      type: object
      required: [image_uri]
      properties:
        image_uri: { type: string, description: "s3:// in the local store (IF-10)" }
        layout_mode: { type: string, enum: [side_by_side, overlay, keep_layout], default: side_by_side }
        translate: { type: boolean, default: false }
        target_lang: { $ref: '#/components/schemas/Language' }
        confidential: { type: boolean, default: true }

    OcrResult:
      type: object
      description: "deploy/schemas/ocr-result.schema.json (IF-76)"
      properties:
        job_id: { type: string, format: uuid }
        page_no: { type: integer }
        image_uri: { type: string }
        width_px: { type: integer }
        height_px: { type: integer }
        layout_mode: { type: string, enum: [side_by_side, overlay, keep_layout] }
        engine: { type: string }
        regions:
          type: array
          items:
            type: object
            properties:
              ordinal: { type: integer }
              bbox: { type: object, properties: { x: { type: integer }, y: { type: integer }, w: { type: integer }, h: { type: integer } } }
              orientation: { type: string, enum: [horizontal, vertical] }
              text: { type: string }
              char_confidence: { type: number }
              handwriting: { type: boolean }
              low_confidence: { type: boolean, description: "handwriting or confidence below the gate — set by the database, cannot be cleared" }
              segment_id: { type: [string, 'null'], format: uuid }

    SegmentChecks:
      type: object
      description: "deploy/schemas/segment-checks.schema.json (IF-74)"
      properties:
        blocking:
          type: object
          properties:
            numbers:
              type: object
              properties:
                ok: { type: boolean }
                source: { type: array, items: { type: string } }
                missing: { type: array, items: { type: string } }
                extra: { type: array, items: { type: string } }
        flags:
          type: object
          properties:
            glossary: { type: object, properties: { ok: { type: boolean }, missing: { type: array, items: { type: string } }, applied: { type: array, items: { type: string } } } }
            forbidden: { type: object, properties: { ok: { type: boolean }, hits: { type: array, items: { type: object, properties: { term: { type: string }, rendering: { type: string }, mandated: { type: string } } } } } }
            length_ratio: { type: object, properties: { ok: { type: boolean }, ratio: { type: [number, 'null'] }, min: { type: [number, 'null'] }, max: { type: [number, 'null'] } } }
            untranslated: { type: object, properties: { ok: { type: boolean } } }
            omission: { type: object, properties: { ok: { type: boolean }, src_sentences: { type: integer }, tgt_sentences: { type: integer } } }
        blocked: { type: boolean }
        flagged: { type: boolean }
        clean: { type: boolean }

    Segment:
      type: object
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        ordinal: { type: integer }
        anchor: { type: [string, 'null'] }
        source_text: { type: string }
        mt_text: { type: [string, 'null'] }
        final_text: { type: [string, 'null'] }
        status: { type: string, enum: [machine, blocked, flagged, edited, needs_review, approved] }
        tm_score: { type: [number, 'null'], description: "1.000 = exact reuse" }
        tm_match_id: { type: [string, 'null'], format: uuid }
        checks: { $ref: '#/components/schemas/SegmentChecks' }
        edit_distance: { type: [number, 'null'] }
        reviewer_note: { type: [string, 'null'] }
        approved_by: { type: [string, 'null'] }
        approved_at: { type: [string, 'null'], format: date-time }
        tm_written_id: { type: [string, 'null'], format: uuid }

    SegmentDetail:
      allOf:
        - { $ref: '#/components/schemas/Segment' }
        - type: object
          properties:
            matches: { type: array, items: { $ref: '#/components/schemas/TmMatch' } }
            edits: { type: array, items: { $ref: '#/components/schemas/SegmentEdit' } }
            interpretation: { oneOf: [ { $ref: '#/components/schemas/Interpretation' }, { type: 'null' } ] }
            glossary_hits:
              type: array
              description: Terms found in the source with their mandated renderings, readings and usage notes (FR-07, FR-08)
              items: { $ref: '#/components/schemas/GlossaryTerm' }

    SegmentEdit:
      type: object
      properties:
        id: { type: string, format: uuid }
        editor: { type: string }
        before_text: { type: [string, 'null'] }
        after_text: { type: string }
        edit_distance: { type: number, description: Normalised Levenshtein }
        ts: { type: string, format: date-time }

    EditRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }

    ApproveRequest:
      type: object
      properties:
        note: { type: string, description: Required when a flag is unresolved }

    ReviewItem:
      allOf:
        - { $ref: '#/components/schemas/Segment' }
        - type: object
          properties:
            kind: { type: string }
            source_lang: { $ref: '#/components/schemas/Language' }
            target_lang: { $ref: '#/components/schemas/Language' }
            register: { type: string }
            fuzzy_matches: { type: integer }
            numbers_missing: { type: array, items: { type: string } }
            numbers_extra: { type: array, items: { type: string } }
            glossary_missing: { type: array, items: { type: string } }
            forbidden_hits: { type: array, items: { type: object, additionalProperties: true } }

    Interpretation:
      type: object
      description: "deploy/schemas/interpretation.schema.json (IF-75). Always inferred: true; never merged into the translation (C-05)."
      required: [inferred, confidence, ambiguous]
      properties:
        inferred: { type: boolean, enum: [true] }
        confidence: { type: number }
        ambiguous: { type: boolean }
        process: { type: [string, 'null'], enum: [injection_molding, press, welding, assembly, painting, inspection, logistics, maintenance, other, null] }
        message_type: { type: [string, 'null'], enum: [problem_report, instruction, spec_change, audit_finding, schedule, request, information, null] }
        entities: { type: object, additionalProperties: true }
        timing_note: { type: [string, 'null'] }
        suggested_checks:
          type: array
          items: { $ref: '#/components/schemas/CheckItem' }
        related_documents:
          type: array
          description: Documents that exist in the index — never free text (AI-09)
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              kind: { type: string }
              uri: { type: string }
        readings:
          type: array
          items: { $ref: '#/components/schemas/Reading' }
        model: { type: [string, 'null'] }
        prompt_version: { type: [string, 'null'] }

    CheckItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        process: { type: string }
        message_type: { type: string }
        ordinal: { type: integer }
        ja: { type: string }
        en: { type: string }
        th: { type: string }
        moldmind_param: { type: [string, 'null'], description: MoldMind parameter name when the item maps to one (SRS-11) }

    Reading:
      type: object
      properties:
        ordinal: { type: integer }
        reading_ja: { type: string }
        th: { type: string }
        en: { type: string }
        usage_note: { type: [string, 'null'] }

    TmSearchRequest:
      type: object
      required: [text, source_lang, target_lang]
      properties:
        text: { type: string }
        source_lang: { $ref: '#/components/schemas/Language' }
        target_lang: { $ref: '#/components/schemas/Language' }
        limit: { type: integer, default: 5, maximum: 20 }

    TmMatch:
      type: object
      properties:
        tm_segment_id: { type: string, format: uuid }
        score: { type: number }
        method: { type: string, enum: [exact, trigram, vector] }
        source_text: { type: string }
        target_text: { type: string }
        diff:
          type: object
          additionalProperties: true
          description: Query vs memory source (for fuzzy matches)
        domain: { type: [string, 'null'] }
        doc_ref: { type: [string, 'null'] }
        approver: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    TmSegment:
      type: object
      properties:
        id: { type: string, format: uuid }
        source_lang: { $ref: '#/components/schemas/Language' }
        target_lang: { $ref: '#/components/schemas/Language' }
        source_text: { type: string }
        target_text: { type: string }
        domain: { type: [string, 'null'] }
        doc_ref: { type: [string, 'null'] }
        approver: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        embedded: { type: boolean }

    TmStats:
      type: object
      properties:
        source_lang: { $ref: '#/components/schemas/Language' }
        target_lang: { $ref: '#/components/schemas/Language' }
        segments: { type: integer }
        embedded: { type: integer }
        last_approved: { type: [string, 'null'], format: date-time }

    GlossaryTerm:
      type: object
      properties:
        id: { type: string, format: uuid }
        ja: { type: [string, 'null'] }
        ja_reading: { type: [string, 'null'] }
        th: { type: [string, 'null'] }
        en: { type: [string, 'null'] }
        domain: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        forbidden:
          type: array
          items: { type: object, required: [lang, text], properties: { lang: { $ref: '#/components/schemas/Language' }, text: { type: string } } }
        aliases: { type: array, items: { $ref: '#/components/schemas/TermAlias' } }
        version_no: { type: integer }
        effective_from: { type: string, format: date }
        approved_by: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }

    GlossaryTermInput:
      type: object
      required: [ja, th, en, domain]
      properties:
        id: { type: string, format: uuid, description: Present for an update }
        ja: { type: string }
        ja_reading: { type: string }
        th: { type: string }
        en: { type: string }
        domain: { type: string, enum: [parameter, metric, defect, document, process, action, material, general] }
        notes: { type: string }
        forbidden:
          type: array
          items: { type: object, required: [lang, text], properties: { lang: { $ref: '#/components/schemas/Language' }, text: { type: string } } }
        effective_from: { type: string, format: date }
        change_note: { type: string }

    TermVersion:
      type: object
      properties:
        version_no: { type: integer }
        ja: { type: [string, 'null'] }
        th: { type: [string, 'null'] }
        en: { type: [string, 'null'] }
        forbidden: { type: array, items: { type: object, additionalProperties: true } }
        approved_by: { type: string }
        effective_from: { type: string, format: date }
        change_note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    TermAlias:
      type: object
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        lang: { $ref: '#/components/schemas/Language' }
        kind: { type: string, enum: [abbreviation, jargon, supplier, variant] }
        note: { type: [string, 'null'] }

    TermAliasInput:
      type: object
      required: [alias, lang, kind]
      properties:
        alias: { type: string }
        lang: { $ref: '#/components/schemas/Language' }
        kind: { type: string, enum: [abbreviation, jargon, supplier, variant] }
        note: { type: string }

    TermCandidate:
      type: object
      properties:
        id: { type: string, format: uuid }
        ja: { type: string }
        th: { type: [string, 'null'] }
        en: { type: [string, 'null'] }
        occurrences: { type: integer }
        source_job_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [proposed, accepted, rejected] }
        proposed_at: { type: string, format: date-time }
        decided_by: { type: [string, 'null'] }
        decided_at: { type: [string, 'null'], format: date-time }

    CandidateDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [accepted, rejected] }
        term: { $ref: '#/components/schemas/GlossaryTermInput' }

    TermUsage:
      type: object
      properties:
        term_id: { type: string, format: uuid }
        ja: { type: string }
        date: { type: string, format: date }
        count: { type: integer }
        inconsistencies: { type: integer }

    TermConsistency:
      type: object
      properties:
        term_id: { type: string, format: uuid }
        ja: { type: string }
        segments: { type: integer }
        consistent: { type: integer }
        inconsistent: { type: integer }
        consistency: { type: [number, 'null'] }

    ImportRequest:
      type: object
      required: [format, file_uri]
      properties:
        format: { type: string, enum: [csv, tbx, tmx] }
        file_uri: { type: string, description: "s3:// in the local store" }
        approver_note: { type: string }

    ImportReport:
      type: object
      properties:
        rows: { type: integer }
        inserted: { type: integer }
        updated: { type: integer }
        rejected: { type: integer }
        errors: { type: array, items: { type: string } }

    ExportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [glossary_csv, glossary_tbx, tm_tmx, tm_csv, audit] }
        uri: { type: string }
        row_count: { type: integer }
        sha256: { type: string }
        created_at: { type: string, format: date-time }

    ToolGlossaryRequest:
      type: object
      required: [text, target_lang]
      properties:
        text: { type: string }
        source_lang: { $ref: '#/components/schemas/Language' }
        target_lang: { $ref: '#/components/schemas/Language' }

    ToolGlossaryResponse:
      type: object
      properties:
        terms: { type: array, items: { $ref: '#/components/schemas/GlossaryTerm' } }

    ToolTermCheckRequest:
      type: object
      required: [text, lang]
      properties:
        text: { type: string }
        lang: { $ref: '#/components/schemas/Language' }
        source_text: { type: string }
        source_lang: { $ref: '#/components/schemas/Language' }

    ToolTermCheckResponse:
      type: object
      properties:
        forbidden: { type: array, items: { type: object, properties: { term: { type: string }, rendering: { type: string }, mandated: { type: string }, position: { type: integer } } } }
        missing: { type: array, items: { type: string } }
        applied: { type: array, items: { type: string } }

    TestSet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        description: { type: [string, 'null'] }
        frozen: { type: boolean }
        segments: { type: integer }
        created_at: { type: string, format: date-time }

    EvalRunRequest:
      type: object
      required: [test_set_id]
      properties:
        test_set_id: { type: string, format: uuid }
        prompt_version: { type: string }
        note: { type: string }

    EvalRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        test_set: { type: string }
        version: { type: integer }
        run_at: { type: string, format: date-time }
        model: { type: string }
        prompt_version: { type: string }
        glossary_compliance: { type: [number, 'null'] }
        numbers_preserved: { type: [number, 'null'] }
        mean_ped: { type: [number, 'null'] }
        class_accuracy: { type: [number, 'null'] }
        passed: { type: [boolean, 'null'], description: "Computed by the database from the gates (glossary ≥ 0.98, numbers = 1, PED ≤ 0.20, classification ≥ 0.90)" }
        investigate: { type: boolean, description: "A metric regressed by more than 2 % against the previous run (AI-08)" }
        gates: { type: object, properties: { glossary: { type: number }, numbers: { type: number }, ped: { type: number }, classification: { type: number } } }
        note: { type: [string, 'null'] }

    EvalRunDetail:
      allOf:
        - { $ref: '#/components/schemas/EvalRun' }
        - type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  ordinal: { type: integer }
                  source_text: { type: string }
                  reference_text: { type: string }
                  mt_text: { type: string }
                  ped: { type: number }
                  glossary_ok: { type: boolean }
                  numbers_ok: { type: boolean }
                  expected_process: { type: [string, 'null'] }
                  process_pred: { type: [string, 'null'] }
                  expected_message_type: { type: [string, 'null'] }
                  message_pred: { type: [string, 'null'] }

    DashboardRow:
      type: object
      properties:
        day: { type: string, format: date }
        source_lang: { $ref: '#/components/schemas/Language' }
        target_lang: { $ref: '#/components/schemas/Language' }
        approved_segments: { type: integer }
        mean_ped: { type: number }
        glossary_compliance: { type: number }
        tm_exact_reused: { type: integer }
        jobs: { type: integer }

    UserRole:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        role: { type: string, enum: [translator, reviewer, admin] }
        granted_by: { type: [string, 'null'] }
        granted_at: { type: string, format: date-time }

    UserRoleInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [translator, reviewer, admin] }

    Config:
      type: object
      properties:
        languages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        registers: { type: array, items: { type: string } }
        tm: { type: object, properties: { fuzzy_threshold: { type: number }, vector: { type: boolean } } }
        checks: { type: object, properties: { numbers_blocking: { type: boolean, enum: [true] }, ratio_bounds: { type: object, additionalProperties: true } } }
        interpretation: { type: object, properties: { separate: { type: boolean, enum: [true] }, ambiguity_threshold: { type: number }, max_readings: { type: integer } } }
        llm: { type: object, properties: { model: { type: string }, max_params_b: { type: number }, temperature: { type: number } } }
        ocr: { type: object, properties: { engine: { type: string }, vertical: { type: boolean }, char_accuracy_min: { type: number } } }
        confidentiality: { type: object, properties: { default_confidential: { type: boolean, enum: [true] }, cloud_provider_enabled: { type: boolean } } }
        gates: { type: object, properties: { glossary: { type: number }, numbers: { type: number }, ped: { type: number }, classification: { type: number }, regression_pct: { type: number } } }
        retention_days: { type: integer }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ready, degraded, not_ready] }
        mode: { type: string, enum: [normal, memory_only, no_ocr, no_store] }
        checks:
          type: object
          additionalProperties: { type: string }
