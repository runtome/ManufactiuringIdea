openapi: 3.1.0
info:
  title: GenbaGo API
  version: 1.0.0
  summary: Japanese ⇄ Thai ⇄ English translation for the shop floor — memory first, glossary enforced, numbers preserved or blocked, and a separate, labelled interpretation of what the sentence is about.
  description: |
    **Scope.** The GenbaGo API — standalone, and the `knowledge.tm_*` module of FactoryBrain in platform mode.
    SRS-14 §4.1's eight paths are kept verbatim under `/api/v1` (`/translate`, `/translate/document`, `/jobs/{id}`, `/ocr`,
    `/glossary`, `/tm/search`, `/segments/{id}/approve`). The platform's `/knowledge/translate` and its components
    (`TranslationResult`, `Language`, `Problem`, the standard parameters and error responses) are copied byte-for-byte from
    API-00 and diffed by TEST-14 TC-008; in platform mode it is served by the gateway.

    **Six contracts (API-Specification.md §3–§8):**
    - **Translation** — memory first (an exact match is reused verbatim), glossary applied and verified, checks computed by
      the database, and a two-part response: the translation and, separately, an `interpretation` that is always labelled
      `inferred: true`.
    - **Checks** — `blocking.numbers` (numbers, units, tolerances, codes, lots, dates must be identical) refuses approval;
      glossary, forbidden renderings, length ratio, untranslated script and omissions are flags that need a resolution or a
      reviewer note.
    - **Interpretation** — process, message type, entities, curated items to check, documents that exist in the index;
      below the ambiguity threshold the response lists readings instead of asserting.
    - **Review & memory** — translators edit (every edit carries its distance), reviewers approve, approval writes the
      memory; the glossary changes only through admins, with versions.
    - **Documents, OCR, batch** — layout-preserving jobs, Japanese vertical OCR with a handwriting flag, resumable batches.
    - **Glossary & memory management** — versions, aliases, mined candidates, usage, consistency, TBX/TMX/CSV exchange.

    Errors are RFC 7807 `application/problem+json` with a stable `code`. Confidential is the default: a job never leaves
    the LAN unless it is explicitly marked otherwise.
  contact: { name: Suphot N. }
  license: { name: Proprietary }
  x-document-id: API-14-GenbaGo

servers:
  - url: https://genbago.plant.local/api/v1
    description: Standalone
  - url: https://factorybrain.plant.local/api/v1
    description: Platform mode (the platform's /knowledge/translate is served by the gateway; the rest under /genba/)

security:
  - bearerAuth: []

tags:
  - { name: translate, description: "SRS §4.1 /translate, /translate/document, /ocr — text, document, image and batch jobs (FR-01…FR-08, FR-16…FR-20)" }
  - { name: jobs, description: "SRS §4.1 /jobs/{id} — status, segments, results, resume (FR-20, NFR-07)" }
  - { name: segments, description: "Segment review — checks, edits, readiness, interpretation, readings, matches, render (FR-27…FR-29)" }
  - { name: review, description: "SRS §4.1 /segments/{id}/approve and the review queue (FR-24, FR-30)" }
  - { name: glossary, description: "SRS §4.1 /glossary — terms, versions, aliases, candidates, usage, consistency, exchange (FR-21…FR-26, NFR-08)" }
  - { name: tm, description: "SRS §4.1 /tm/search — memory lookup, import/export, stats (FR-03, FR-24, FR-25, NFR-03)" }
  - { name: tools, description: "IF-16 as provider — glossary_lookup, term_check for 10 Copilot and 09 QE-Agent" }
  - { name: evaluation, description: "Test sets and evaluation runs — the release gate (AI-02, AI-03, AI-05, AI-08)" }
  - { name: knowledge, description: "Platform path (API-00, verbatim)" }
  - { name: admin, description: "Roles, configuration, dashboard" }
  - { name: system, description: "Health, readiness, metrics" }

paths:
  # ---------------------------------------------------------------- SRS-14 §4.1 — verbatim paths
  /translate:
    post:
      tags: [translate]
      operationId: translateText
      summary: "Text translation + interpretation (SRS §4.1; FR-01…FR-08, FR-09…FR-15)"
      description: |
        Segments the text, looks the memory up (an exact match is reused verbatim, no model call), translates under
        glossary constraints, runs the checks, and — unless `interpret: false` — builds the interpretation. Synchronous for
        ≤ 2,000 characters (NFR-01); longer texts return `202` with a job. The response keeps the translation and the
        interpretation apart (C-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateRequest'
      responses:
        '200':
          description: Translation with checks and a separate interpretation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslateResponse'
        '202':
          description: Long text — accepted as a job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /translate/document:
    post:
      tags: [translate]
      operationId: translateDocument
      summary: "Document translation job — DOCX / XLSX / PPTX / PDF, layout preserved (SRS §4.1; FR-16, FR-17)"
      description: "The file must already be in the local object store (s3://…, IF-10). Confidential by default; a confidential job cannot use a non-local provider (C-03)."
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '409': { description: "CONFIDENTIAL_LOCAL — a confidential job cannot use a non-local provider or the Discord channel", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /jobs/{id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: "Job status / result (SRS §4.1; FR-20, NFR-07)"
      parameters:
        - { name: id, in: path, required: true, description: "Job id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ocr:
    post:
      tags: [translate]
      operationId: ocrImage
      summary: "Image → text, Japanese-aware (SRS §4.1; FR-18, FR-19, AI-06)"
      description: "Vertical and horizontal regions, character confidence, handwriting flagged low-confidence (IF-76). With translate = true the regions become segments of an OCR job."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrRequest'
      responses:
        '200':
          description: OCR result (IF-76)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResult'
        '202':
          description: OCR + translation job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /glossary:
    get:
      tags: [glossary]
      operationId: searchGlossary
      summary: "Glossary lookup (SRS §4.1; FR-21, FR-22)"
      description: Matches the term in any language, its reading and its aliases; returns the current version with forbidden renderings.
      parameters:
        - { name: q, in: query, description: "Term, reading, alias or substring", schema: { type: string } }
        - { name: lang, in: query, description: "ja | th | en — restrict the field searched", schema: { type: string } }
        - { name: domain, in: query, description: "parameter | metric | defect | document | process | action | material | general", schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GlossaryTerm' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [glossary, admin]
      operationId: upsertGlossaryTerm
      summary: "Add or update a term — admin only, versioned (SRS §4.1; FR-21, FR-30, NFR-08)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlossaryTermInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryTerm'
        '200':
          description: Updated (new version)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryTerm'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "FORBIDDEN_IS_MANDATED — a forbidden rendering equals the mandated one; GLOSSARY_APPROVER — approver is not an admin", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tm/search:
    post:
      tags: [tm]
      operationId: searchTm
      summary: "Fuzzy TM search (SRS §4.1; FR-03, AI-07, NFR-03)"
      description: Exact match first (by normalised hash) and alone; otherwise candidates ≥ 0.85 by trigram (reference score) and by vector cosine, each with a diff against the query.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TmSearchRequest'
      responses:
        '200':
          description: Candidates, best first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TmMatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /segments/{id}/approve:
    post:
      tags: [review]
      operationId: approveSegment
      summary: "Approve and store to TM (SRS §4.1; FR-24, FR-30, AC-07)"
      description: |
        Reviewer or admin only. Refused while `blocking.numbers` fails (`409 SEGMENT_BLOCKED`) or a flag is unresolved without a
        note (`409 SEGMENT_FLAGGED`). On success the segment is written to `knowledge.tm_segment` once and linked.
      parameters:
        - { name: id, in: path, required: true, description: "Segment id", schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Approved; tm_written_id set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "SEGMENT_BLOCKED · SEGMENT_FLAGGED · APPROVER_ROLE · TM_CONFLICT · SEGMENT_APPROVED", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  # ---------------------------------------------------------------- Platform path (API-00, verbatim)
  /knowledge/translate:
    post:
      tags: [knowledge]
      summary: Translate manufacturing text with structured interpretation
      description: |
        Returns the translation and, separately, an **inferred** interpretation
        (process, message type, entities, items to check). The two are never
        merged: users must be able to tell what was said from what the system
        inferred.
      operationId: translate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, target_lang]
              properties:
                text: { type: string }
                source_lang:
                  $ref: '#/components/schemas/Language'
                target_lang:
                  $ref: '#/components/schemas/Language'
                register:
                  type: string
                  enum: [report, shopfloor, customer]
                  default: report
      responses:
        '200':
          description: Translation with interpretation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResult'
  # ---------------------------------------------------------------- Jobs
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Jobs, newest first (the caller's own unless reviewer/admin)
      parameters:
        - { name: status, in: query, description: "queued | running | done | failed | cancelled", schema: { type: string } }
        - { name: kind, in: query, description: "text | document | ocr | hmi | batch", schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /jobs/{id}/segments:
    get:
      tags: [jobs, segments]
      operationId: listJobSegments
      summary: The segments of a job with checks, TM score and status (FR-27)
      parameters:
        - { name: id, in: path, required: true, description: "Job id", schema: { type: string, format: uuid } }
        - { name: status, in: query, description: "machine | blocked | flagged | edited | needs_review | approved", schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Segment' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{id}/result:
    get:
      tags: [jobs]
      operationId: getJobResult
      summary: The translated document / side-by-side PDF / batch report (FR-16, FR-17, FR-20)
      parameters:
        - { name: id, in: path, required: true, description: "Job id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "JOB_NOT_DONE", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /jobs/{id}/files:
    get:
      tags: [jobs]
      operationId: listJobFiles
      summary: Batch items with their status and error (FR-20)
      parameters:
        - { name: id, in: path, required: true, description: "Job id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{id}/resume:
    post:
      tags: [jobs]
      operationId: resumeJob
      summary: Resume a failed job at the first unfinished item (NFR-07)
      parameters:
        - { name: id, in: path, required: true, description: "Job id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "JOB_NOT_FAILED", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /jobs/{id}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a queued or running job
      parameters:
        - { name: id, in: path, required: true, description: "Job id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "JOB_FINISHED", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /translate/batch:
    post:
      tags: [translate]
      operationId: translateBatch
      summary: Batch-translate a folder of documents with a progress and error report (FR-20)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '202':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  # ---------------------------------------------------------------- Segments and review
  /review:
    get:
      tags: [review]
      operationId: reviewQueue
      summary: The review queue — source, MT, TM match, glossary hits, badges (FR-27, FR-28)
      parameters:
        - { name: job_id, in: query, description: "Restrict to a job", schema: { type: string, format: uuid } }
        - { name: status, in: query, description: "blocked | flagged | edited | needs_review", schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReviewItem' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /segments/{id}:
    get:
      tags: [segments]
      operationId: getSegment
      summary: A segment with its checks, matches, edits and interpretation
      parameters:
        - { name: id, in: path, required: true, description: "Segment id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /segments/{id}/edit:
    post:
      tags: [segments]
      operationId: editSegment
      summary: A translator edits the target — recorded with its edit distance (FR-29, FR-30)
      parameters:
        - { name: id, in: path, required: true, description: "Segment id", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRequest'
      responses:
        '200':
          description: Edited; checks recomputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "EDITOR_ROLE · SEGMENT_APPROVED", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /segments/{id}/ready:
    post:
      tags: [segments]
      operationId: markSegmentReady
      summary: Mark a clean or resolved segment ready for review (needs_review)
      parameters:
        - { name: id, in: path, required: true, description: "Segment id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "SEGMENT_BLOCKED — a blocked segment cannot be marked ready", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /segments/{id}/checks:
    get:
      tags: [segments]
      operationId: getSegmentChecks
      summary: "The check object (IF-74) — blocking numbers, flags"
      parameters:
        - { name: id, in: path, required: true, description: "Segment id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentChecks'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /segments/{id}/interpretation:
    get:
      tags: [segments]
      operationId: getInterpretation
      summary: "The interpretation (IF-75) — inferred, separate from the translation (FR-14, AC-08)"
      parameters:
        - { name: id, in: path, required: true, description: "Segment id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interpretation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [segments]
      operationId: requestInterpretation
      summary: Build the interpretation for a segment that was translated without one
      parameters:
        - { name: id, in: path, required: true, description: "Segment id", schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interpretation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "READINGS_REQUIRED — ambiguous source; readings are generated first", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /segments/{id}/readings:
    get:
      tags: [segments]
      operationId: getReadings
      summary: Alternative readings of an ambiguous source (FR-15, AC-05)
      parameters:
        - { name: id, in: path, required: true, description: "Segment id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Readings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reading' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /segments/{id}/matches:
    get:
      tags: [segments]
      operationId: getSegmentMatches
      summary: TM candidates offered for the segment with diffs (FR-03)
      parameters:
        - { name: id, in: path, required: true, description: "Segment id", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TmMatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
