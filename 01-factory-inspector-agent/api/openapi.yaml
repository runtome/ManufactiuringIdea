        lang: { $ref: '#/components/schemas/Language' }
        answer: { type: string }
        charts:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [trend, pareto, station, histogram] }
              data: { type: object, additionalProperties: true }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        grounding:
          type: object
          properties:
            numbers_found:
              type: array
              items: { type: string }
            all_matched: { type: boolean }
        latency_ms: { type: integer }
        model: { type: string }

    AgentRunTrace:
      type: object
      properties:
        id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        correlation_id: { type: [string, 'null'] }
        kind: { type: string }
        question: { type: [string, 'null'] }
        answer: { type: [string, 'null'] }
        model: { type: string }
        prompt_version: { type: [string, 'null'] }
        outcome: { type: string, enum: [ok, partial, refused, grounding_failed, error, budget_exceeded] }
        facts: { type: [object, 'null'], additionalProperties: true }
        grounding: { type: [object, 'null'], additionalProperties: true }
        tokens_in: { type: [integer, 'null'] }
        tokens_out: { type: [integer, 'null'] }
        latency_ms: { type: [integer, 'null'] }
