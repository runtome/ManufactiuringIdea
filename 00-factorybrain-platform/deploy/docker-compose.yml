# =====================================================================
# FactoryBrain AI Platform — reference deployment stack
# Document : OPS-00-FactoryBrain (see ../docs/OPS-FactoryBrain-Deployment-Operations.md)
# Version  : 1.0
# Date     : 2026-09-10
#
# Usage:
#   cp .env.example .env      # then edit .env — it MUST NOT be committed
#   docker compose up -d
#   docker compose ps         # all services should report healthy within 5 min
#
# Topology: single-node all-in-one (server zone Z3). Edge nodes and mobile
# devices are provisioned separately and connect inbound over IF-01 / IF-11.
#
# IMAGE PINNING: production deployments MUST pin by digest, not tag
# (SEC-192). Tags are used here for readability; OPS section 5.4 describes
# the digest-pinning procedure and the air-gapped bundle.
# =====================================================================

name: factorybrain

# ---------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-common: &app-common
  image: ${FB_IMAGE_APP:-factorybrain/app:1.0.0}
  restart: unless-stopped
  logging: *default-logging
  env_file: [.env]
  depends_on:
    postgres: { condition: service_healthy }
    redis:    { condition: service_healthy }
    minio:    { condition: service_healthy }
  networks: [backend]

services:

  # -------------------------------------------------------------------
  # Data platform
  # -------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factorybrain}
      POSTGRES_USER: ${POSTGRES_USER:-factorybrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Tuned for the 32 GB reference server (OPS section 8.2)
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=8GB
      - -c
      - effective_cache_size=24GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - max_connections=200
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factorybrain} -d ${POSTGRES_DB:-factorybrain}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]
    # Not published to the host: management interfaces stay inside the
    # platform zone (SEC-264). Use `docker compose exec` for admin access.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "1gb"
      - --maxmemory-policy
      - "noeviction"   # queue + GPU semaphore must never be silently evicted
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set fb http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      for b in evidence documents reports models backups; do
        mc mb --ignore-existing fb/$$b;
        mc anonymous set none fb/$$b;
      done &&
      mc ilm rule add --expire-days 730 fb/evidence  || true;
      mc ilm rule add --expire-days 90  fb/backups   || true;
      echo 'bucket init complete'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [backend]
    restart: "no"

  # -------------------------------------------------------------------
  # Inference
  # -------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.5.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: "1"   # 8 GB VRAM: one model resident (C-02)
      OLLAMA_NUM_PARALLEL: "1"        # serialise; the semaphore does the queuing
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [backend]

  # -------------------------------------------------------------------
  # Application
  # -------------------------------------------------------------------
  api:
    <<: *app-common
    command: ["uvicorn", "factorybrain.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    networks: [backend, frontend]

  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    # Runs to completion before api starts. A failed migration must stop
    # the deployment rather than let a mismatched schema serve traffic.

  worker:
    <<: *app-common
    command: ["rq", "worker", "--with-scheduler", "ingest", "reports", "retention", "knowledge"]
    healthcheck:
      test: ["CMD-SHELL", "rq info --url redis://redis:6379 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${FB_WORKER_REPLICAS:-2}

  agent:
    <<: *app-common
    command: ["python", "-m", "factorybrain.agent.runner"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      ollama:   { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No GPU reservation: the agent reaches the GPU through Ollama, and
    # arbitration is the Redis semaphore (ADR-011), not Docker.

  vision:
    <<: *app-common
    command: ["python", "-m", "factorybrain.vision.service"]
    volumes:
      - model_cache:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["vision"]   # optional: server-side batch inference

  notifier:
    <<: *app-common
    command: ["python", "-m", "factorybrain.notifier.bot"]
    # Single instance only: the Discord gateway session must not be duplicated.
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8300/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ${FB_IMAGE_WEB:-factorybrain/web:1.0.0}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: ${FB_PUBLIC_URL:-https://factorybrain.local}/api/v1
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [frontend]

  # -------------------------------------------------------------------
  # Edge / ingress
  # -------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [frontend]

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8883:8883"   # TLS only; 1883 deliberately not published
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./certs:/mosquitto/certs:ro
      - mqttdata:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt -t '$$SYS/#' -C 1 -W 3 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [backend, edge]
    profiles: ["telemetry"]

  # -------------------------------------------------------------------
  # Observability
  # -------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    networks: [backend]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"   # air-gap friendly
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus: { condition: service_started }
    networks: [backend, frontend]

  # -------------------------------------------------------------------
  # Scheduled operations
  # -------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env]
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 86400; /backup.sh; done"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true      # egress default-deny for data-plane services (SEC-240)
  edge:
    driver: bridge

volumes:
  pgdata:
  wal_archive:
  redisdata:
  miniodata:
  ollama_models:
  model_cache:
  mqttdata:
  promdata:
  grafanadata:
  caddy_data:
  caddy_config:
  backups:

# =====================================================================
# NOTES
#
# 1. `backend` is marked `internal: true`, so postgres, redis, minio,
#    ollama, worker and agent have NO outbound internet route. Only
#    services also attached to `frontend` can egress. This implements
#    SEC-240 (egress default-deny) at the network layer rather than
#    relying on application discipline.
#
#    Consequence to be aware of: `ollama pull` will NOT work from inside
#    this network. Models are pre-pulled into the `ollama_models` volume
#    during provisioning — see OPS section 5.3. That is intentional: an
#    air-gapped deployment must work the same way as a connected one.
#
# 2. `../db` is mounted into the postgres init directory, so schema.sql
#    and seed_demo.sql apply automatically on FIRST START ONLY (when the
#    data directory is empty). Subsequent schema changes go through
#    alembic in the `migrate` service.
#
#    seed_demo.sql refuses to run against a non-empty database, so a
#    production deployment that already has data cannot be seeded by
#    accident.
#
# 3. The `vision` and `telemetry` profiles are opt-in:
#      docker compose --profile vision --profile telemetry up -d
#
# 4. Only caddy publishes host ports. Postgres, Redis, MinIO, Prometheus
#    and Ollama are not reachable from outside the host (SEC-264).
#
# 5. GPU: requires the NVIDIA Container Toolkit on the host. With one
#    8 GB card, `ollama` and `vision` both reserve it; they must not run
#    heavy work concurrently. The Redis-backed GPU semaphore in the
#    application enforces that (ADR-011) — Docker cannot.
# =====================================================================
